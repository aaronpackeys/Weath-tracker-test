<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bese – wealth tracker</title>
<meta name="description" content="Bese tracks your MoMo, cash, bank, T-bills, land, businesses and debts in one place.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cg%20fill%3D%22%231E6A49%22%3E%3Cellipse%20cx%3D%2250%22%20cy%3D%2225%22%20rx%3D%2215%22%20ry%3D%2223%22/%3E%3Cellipse%20cx%3D%2250%22%20cy%3D%2225%22%20rx%3D%2215%22%20ry%3D%2223%22%20transform%3D%22rotate%2890%2050%2050%29%22/%3E%3Cellipse%20cx%3D%2250%22%20cy%3D%2225%22%20rx%3D%2215%22%20ry%3D%2223%22%20transform%3D%22rotate%28180%2050%2050%29%22/%3E%3Cellipse%20cx%3D%2250%22%20cy%3D%2225%22%20rx%3D%2215%22%20ry%3D%2223%22%20transform%3D%22rotate%28270%2050%2050%29%22/%3E%3C/g%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2212%22%20fill%3D%22%23B9851A%22/%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%226%22%20fill%3D%22none%22%20stroke%3D%22%23F1F4EF%22%20stroke-width%3D%223%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#F1F4EF; --surface:#FFFFFF; --ink:#132A22; --muted:#5A6B62; --line:#D9E1DA;
  --green:#1E6A49; --green-soft:#DDEDE3; --gold:#B9851A; --gold-soft:#F5E8C8;
  --red:#AE3A2D; --red-soft:#F6DEDA; --chip:#E6ECE5;
  --s1:#1E6A49; --s2:#B9851A; --s3:#3E5C8A; --s4:#8A4F7D; --s5:#6B8F3A; --s6:#9A6A3C;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#0E1915; --surface:#15231E; --ink:#E7EFEA; --muted:#92A49A; --line:#26372F;
    --green:#52B487; --green-soft:#183A2B; --gold:#E2B24C; --gold-soft:#3A2F15;
    --red:#E4766C; --red-soft:#3D1F1B; --chip:#1C2D26;
    --s1:#52B487; --s2:#E2B24C; --s3:#7C9BD0; --s4:#C88CBB; --s5:#9CC266; --s6:#D19E6C;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#0E1915; --surface:#15231E; --ink:#E7EFEA; --muted:#92A49A; --line:#26372F;
  --green:#52B487; --green-soft:#183A2B; --gold:#E2B24C; --gold-soft:#3A2F15;
  --red:#E4766C; --red-soft:#3D1F1B; --chip:#1C2D26;
  --s1:#52B487; --s2:#E2B24C; --s3:#7C9BD0; --s4:#C88CBB; --s5:#9CC266; --s6:#D19E6C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
img{max-width:100%}

/* Header + tabs */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:14px 20px 0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-weight:800;font-size:1.6rem;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.logo-mark{width:32px;height:32px;display:inline-block;color:var(--green);flex:none}
.logo-mark svg{width:100%;height:100%;display:block}
.about-mark{width:84px;height:84px;color:var(--green);flex:none}
.about-mark svg{width:100%;height:100%}
.saved{font-size:.8rem;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;text-decoration:none;color:var(--muted);font-weight:600;font-size:.95rem;padding:10px 12px;border-bottom:3px solid transparent}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--gold)}

main{max-width:1080px;margin:0 auto;padding:20px 20px 120px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em;margin:0}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack>*+*{margin-top:12px}
.section{margin-top:32px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}

/* Hero */
.hero{padding:8px 0 4px}
.hero-label{color:var(--muted);font-weight:500}
.hero-num{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,9vw,4.4rem);line-height:1;letter-spacing:-.035em;margin:6px 0 18px;font-variant-numeric:tabular-nums}
.hero-num small{font-size:.38em;font-weight:700;letter-spacing:0;margin-right:.25em;color:var(--muted);vertical-align:.9em}
.strip{display:flex;height:18px;border-radius:4px;overflow:hidden;background:var(--chip)}
.strip span{display:block;height:100%;min-width:3px}
.strip span+span{border-left:2px solid var(--paper)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:.9rem}
.legend b{font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}

/* Month nav */
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav strong{font-family:var(--display);font-size:1.15rem;min-width:9.5ch;text-align:center}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;font-size:1.1rem;line-height:1}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--surface);padding:14px 16px}
.stat .k{font-size:.85rem;color:var(--muted)}
.stat .v{font-family:var(--display);font-weight:700;font-size:1.35rem;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.pos{color:var(--green)} .neg{color:var(--red)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid2{display:grid;grid-template-columns:1fr;gap:20px}
@media (min-width:860px){.grid2{grid-template-columns:1.2fr 1fr}}

/* Category bars */
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;padding:8px 0}
.bar-row+.bar-row{border-top:1px solid var(--line)}
.bar-row .amt{font-variant-numeric:tabular-nums;font-weight:600}
.track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--chip);position:relative;overflow:hidden;margin-top:4px}
.track i{position:absolute;inset:0 auto 0 0;background:var(--green);border-radius:4px}
.track i.over{background:var(--red)}
.track i.warn{background:var(--gold)}

/* Lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
button.item:hover{background:var(--chip)}
.acct-row{display:flex;align-items:center;border-top:1px solid var(--line)}
.acct-row:first-child{border-top:0}
.acct-row>.item{border-top:0;flex:1;min-width:0}
.acct-row .chk{flex:none;margin-right:12px}
.rec-grid{display:grid;grid-template-columns:1fr auto;gap:6px 14px;margin:12px 0;font-size:.95rem}
.rec-grid .v{text-align:right;font-variant-numeric:tabular-nums}
.rec-grid .tot{font-weight:700;border-top:1px solid var(--line);padding-top:6px}
.item .main{flex:1;min-width:0}
.item .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.badge{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:.8rem;background:var(--chip);color:var(--muted)}
.badge.in{background:var(--green-soft);color:var(--green)}
.badge.out{background:var(--red-soft);color:var(--red)}
.badge.tr{background:var(--gold-soft);color:var(--gold)}
.dayhead{font-size:.85rem;font-weight:600;color:var(--muted);margin:18px 0 6px}
.tag{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--gold-soft);color:var(--gold);margin-left:6px;vertical-align:1px}
.tag.red{background:var(--red-soft);color:var(--red)}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0E1915}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0E1915}}
.btn.danger{color:var(--red)}
.btn.small{padding:6px 10px;font-size:.85rem}
.linkbtn{background:none;border:0;color:var(--green);font-weight:600;padding:4px 0}
.fabs{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:10px;align-items:center}
.fab{border:0;border-radius:999px;background:var(--green);color:#fff;font-weight:700;padding:14px 22px;font-size:1rem;box-shadow:0 6px 20px rgba(19,42,34,.25);display:flex;align-items:center;gap:8px}
:root[data-theme="dark"] .fab{color:#0E1915}
.fab.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 14px rgba(19,42,34,.15)}
.fab[hidden]{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fab{color:#0E1915}}
.fab span{font-size:1.3rem;line-height:1}

/* Empty */
.empty{border:1px dashed var(--line);border-radius:10px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 12px}

/* Filters */
.seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:6px;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px}
.search{max-width:260px}

/* Dialog */
dialog{border:0;border-radius:14px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 40px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,20,16,.5)}
.dlg-head{padding:18px 20px 0;display:flex;align-items:center;justify-content:space-between}
.dlg-body{padding:16px 20px;overflow:auto}
.dlg-foot{padding:0 20px 20px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.dlg-foot .spacer{flex:1}
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.amount-input{font-family:var(--display);font-size:1.8rem;font-weight:700;padding:8px 12px}
.err{color:var(--red);font-size:.9rem;margin-top:10px;min-height:1.2em}

/* Chart */
.chart-wrap{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}

/* Goals */
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.goal .pct{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1}
.ring-track{height:10px;border-radius:5px;background:var(--chip);overflow:hidden;margin:12px 0 8px}
.ring-track i{display:block;height:100%;background:var(--gold)}

.banner{background:var(--gold-soft);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:.92rem;margin-bottom:16px}
.banner button{margin-left:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card-val{font-family:var(--display);font-weight:800;font-size:1.65rem;line-height:1.1;margin-top:12px;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:14px 0;font-size:.9rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.kv dd.next{color:var(--gold);font-weight:600}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.plain{background:var(--chip);color:var(--muted)}
a.btn{text-decoration:none;display:inline-block;color:var(--ink)}
.pinrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.hint{font-size:.85rem;color:var(--muted);margin-top:6px}
.btn.armed{background:var(--red);border-color:var(--red);color:#fff}
.badge.rs{background:var(--chip);color:var(--ink)}
.diff{font-size:.82rem;color:var(--muted);margin-top:3px}
.diff div{overflow-wrap:anywhere}
.act-right{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.lock{display:flex;gap:10px;align-items:flex-start;background:var(--green-soft);border-radius:10px;padding:12px 14px;font-size:.92rem;margin-bottom:16px}
.owe{margin:12px 0 0;font-size:.95rem;color:var(--muted)}
.owe strong{color:var(--ink);font-variant-numeric:tabular-nums}
.owe strong.neg{color:var(--red)}
.payoff{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin:10px 0 4px}
.payoff i{display:block;height:100%;background:var(--green)}
#lockscreen{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto}
#lockscreen[hidden]{display:none}
body.locked .top, body.locked main, body.locked .fabs{visibility:hidden}
.lock-card{width:min(380px,100%);text-align:center}
.lock-card .logo{justify-content:center;font-size:2rem;margin-bottom:18px}
.lock-card h1{font-size:1.4rem;margin-bottom:6px}
.lock-input{font-family:var(--display);font-size:1.6rem;text-align:center;letter-spacing:.3em;margin-top:18px}
.lock-card .btn{width:100%;margin-top:12px;padding:12px}
.lock-links{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;margin-top:14px}
.rec-code{font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:.06em;text-align:center;background:var(--gold-soft);border-radius:10px;padding:16px;margin:14px 0;user-select:all}
.sec-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.sec-row:first-of-type{border-top:0}
.scan-note{background:var(--gold-soft);border-radius:10px;padding:10px 12px;font-size:.9rem;margin-bottom:6px}
.scan-note ul{margin:6px 0 0;padding-left:18px}
.scan-prev{display:block;max-height:220px;max-width:100%;margin:10px auto 0;border-radius:8px;border:1px solid var(--line)}
.spinner{width:34px;height:34px;border-radius:50%;border:4px solid var(--chip);border-top-color:var(--green);margin:16px auto;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation:none;border-top-color:var(--gold)}}
.choice{display:grid;gap:10px;margin-top:6px}
.choice .btn{padding:14px;text-align:left}
.cam-wrap{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:3/4;max-height:62vh;margin:0 auto}
.cam-wrap video{width:100%;height:100%;object-fit:cover;display:block}
.cam-frame{position:absolute;inset:8%;border:2px dashed rgba(255,255,255,.75);border-radius:8px;pointer-events:none}
.cam-status{position:absolute;inset:auto 0 12px;text-align:center;color:#fff;font-size:.9rem;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.btn.capture{width:100%;padding:14px;font-size:1.05rem}
.srow{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .sdesc{font-size:.85rem;padding:6px 8px}
.srow .samt{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.srow .sctl{grid-column:2/-1;display:flex;gap:6px;flex-wrap:wrap}
.srow .sctl select{width:auto;flex:1 1 140px;font-size:.85rem;padding:6px 8px}
.srow.off{opacity:.5}
.ins-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.ins{border-radius:10px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line)}
.ins.warning{border-left-color:var(--red)} .ins.opportunity{border-left-color:var(--gold)} .ins.win{border-left-color:var(--green)} .ins.tip{border-left-color:var(--s3)}
.ins .k{font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.ins h3{margin:4px 0 6px;font-size:1rem}
.ins p{margin:0;font-size:.92rem}
.ins .act{margin-top:8px;font-size:.88rem;color:var(--green);font-weight:600}
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.score .ring{width:110px;height:110px;flex:none}
.score .ring text{font-family:var(--display);font-weight:800;fill:var(--ink)}
.comp{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:.88rem;flex:1;min-width:240px}
.comp .bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.comp .bar i{display:block;height:100%;background:var(--green)}
.ask{display:flex;gap:8px;margin-top:10px}
.answer{white-space:pre-wrap;font-size:.95rem;line-height:1.55;margin-top:10px}
.fc-table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:520px}
.fc-table th,.fc-table td{padding:8px 6px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.fc-table th:first-child,.fc-table td:first-child{text-align:left}
.rp-table{width:100%;border-collapse:collapse;font-size:.9rem}
.rp-table td,.rp-table th{padding:7px 6px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.rp-table td:first-child,.rp-table th:first-child{text-align:left}
.rp-table tr.tot td{font-weight:700}
table.cats{width:100%;border-collapse:collapse}
table.cats td{padding:8px 0;border-top:1px solid var(--line)}
@media (max-width:560px){
  .stats{grid-template-columns:1fr}
  .stat{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .fab{padding:14px 18px}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">

<script>
(function(){
"use strict";

/* ---------- Defaults ---------- */
const ACCOUNT_TYPES = {momo:"Mobile money", bank:"Bank", cash:"Cash in hand", card:"Card / wallet", other:"Other"};
const INV_KINDS = {
  tbill:"Treasury bill", bond:"Government bond", eurobond:"Eurobond", fd:"Fixed deposit",
  shares:"Shares (GSE / foreign)", fund:"Mutual / unit trust fund", pension:"Pension (Tier 3)",
  property:"Land / property", business:"Business stake", crypto:"Crypto", other:"Other"
};
const PROP_KINDS = {land:"Land / plot", house:"House", apartment:"Apartment / flat", commercial:"Commercial building / shops", uncompleted:"Uncompleted building", farm:"Farm land", other:"Other property"};
const PROP_STATUS = {owned:"Owned", construction:"Under construction", rented:"Rented out", acquiring:"Being acquired", family:"Family / stool land", sold:"Sold"};
const PROP_TAG = {owned:"green", construction:"", rented:"green", acquiring:"", family:"plain", sold:"plain"};
const TITLE_DOCS = {certificate:"Land title certificate", indenture:"Indenture", lease:"Lease", allocation:"Allocation note / letter", permit:"Building permit only", none:"No document yet"};
const BIZ_TYPES = {sole:"Sole proprietorship", ltd:"Private limited company", plc:"Public limited company", partnership:"Partnership", guarantee:"Company limited by guarantee (NGO / foundation)", holding:"Holding company", subsidiary:"Subsidiary", coop:"Cooperative", other:"Other"};
const BIZ_STATUS = {idea:"Planning", registering:"Registering", active:"Active", dormant:"Dormant", closed:"Closed / sold"};
const BIZ_TAG = {idea:"plain", registering:"", active:"green", dormant:"plain", closed:"red"};
const DEBT_KINDS = {bank:"Bank loan", mortgage:"Mortgage", car:"Car loan", staff:"Staff / salary loan", card:"Credit card / overdraft", micro:"Microfinance / savings & loans", digital:"Mobile / digital loan", business:"Business loan", family:"Family member", person:"Friend / individual", other:"Other"};
function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function DEFAULT(){
  return {
    v:1,
    accounts:[
      {id:"momo", name:"Mobile money", type:"momo", currency:"GHS", opening:0},
      {id:"bank", name:"Bank account", type:"bank", currency:"GHS", opening:0},
      {id:"cash", name:"Cash in hand", type:"cash", currency:"GHS", opening:0}
    ],
    cats:{
      expense:["Food & groceries","Transport & fuel","Rent & housing","Utilities (ECG, water)","Airtime & data","School fees","Family support","Church & giving","Health","Clothing","Funerals & social events","Entertainment","Loan repayment","Other"],
      income:["Salary","Business","Allowances","Investment income","Rent received","Gift","Other"]
    },
    budgets:{}, goals:[], inv:[], props:[], biz:[], debts:[], held:[], recur:[], fx:{USD:null, own:{}, modes:{}}, prefs:{cur:"GHS"}, tx:[]
  };
}

/* ---------- State ---------- */
let S = DEFAULT();
let db = null, base = null, mode = "local";
let viewMonth = today().slice(0,7);
let txFilter = "all", txSearch = "";
const LS_KEY = "sika:v1";

try { const raw = localStorage.getItem(LS_KEY); if (raw) S = normalize(JSON.parse(raw)); } catch(e) {}
const LOG_KEY = "sika:log:v1";
let LOG = [];
try { const r = localStorage.getItem(LOG_KEY); if (r){ const a = JSON.parse(r); if (Array.isArray(a)) LOG = a; } } catch(e) {}
let actFilter = "all", actKind = "all", actLimit = 200;

function withCash(list){
  list = list.map(a => a.type==="cash" && a.name==="Cash" ? Object.assign({}, a, {name:"Cash in hand"}) : a);
  if (!list.some(a => a.type==="cash")) list = list.concat([{id: list.some(a=>a.id==="cash") ? uid() : "cash", name:"Cash in hand", type:"cash", currency:"GHS", opening:0}]);
  return list;
}
function normalize(o){
  const d = DEFAULT();
  if (!o || typeof o !== "object") return d;
  return {
    v:1,
    accounts: withCash(Array.isArray(o.accounts) && o.accounts.length ? o.accounts : d.accounts),
    cats: o.cats && Array.isArray(o.cats.expense) && Array.isArray(o.cats.income) ? o.cats : d.cats,
    budgets: o.budgets && typeof o.budgets==="object" ? o.budgets : {},
    goals: Array.isArray(o.goals) ? o.goals : [],
    inv: Array.isArray(o.inv) ? o.inv : [],
    props: Array.isArray(o.props) ? o.props : [],
    biz: Array.isArray(o.biz) ? o.biz : [],
    debts: Array.isArray(o.debts) ? o.debts : [],
    held: Array.isArray(o.held) ? o.held : [],
    lock: o.lock && typeof o.lock==="object" && o.lock.pin ? o.lock : null,
    recur: Array.isArray(o.recur) ? o.recur : [],
    fx: (() => { const f = o.fx && typeof o.fx==="object" ? Object.assign({}, o.fx) : {USD:null}; f.own = Object.assign({}, f.own||{}); f.modes = Object.assign({}, f.modes||{}); if (Number(f.USD)>0 && !f.own.USD) f.own.USD = Number(f.USD); if (f.mode && !f.modes.USD) f.modes.USD = f.mode; return f; })(),
    prefs: o.prefs && typeof o.prefs==="object" ? o.prefs : {cur:"GHS"},
    tx: Array.isArray(o.tx) ? o.tx : []
  };
}

/* ---------- Persistence ---------- */
const dirty = {core:false, months:new Set(), logs:new Set()};
let flushTimer = null;
const chains = {};
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e) {} }
function markCore(){ dirty.core = true; schedule(); }
function markMonth(m){ if (m) dirty.months.add(m); schedule(); }
function schedule(){ audit(); saveLocal(); if (!db) return; clearTimeout(flushTimer); flushTimer = setTimeout(flush, 500); }
function coreBody(){ return {v:1, accounts:S.accounts, cats:S.cats, budgets:S.budgets, goals:S.goals, inv:S.inv, props:S.props, biz:S.biz, debts:S.debts, held:S.held, recur:S.recur, lock:S.lock, prefs:S.prefs, fx:S.fx}; }
function writeDoc(id, body){
  const prev = chains[id] || Promise.resolve();
  chains[id] = prev.then(() => db.collection(base).doc(id).set(body)).catch(err => onWriteError(err));
  return chains[id];
}
function flush(){
  flushTimer = null;
  if (!db) return;
  if (dirty.core){ dirty.core = false; writeDoc("core", coreBody()); }
  dirty.months.forEach(m => writeDoc("tx-"+m, {items:S.tx.filter(t => t.date.slice(0,7)===m)}));
  dirty.months.clear();
  dirty.logs.forEach(m => logChunks(m).forEach((items,i) => writeDoc(i===0 ? "log-"+m : "log-"+m+"-"+(i+1), {items})));
  dirty.logs.clear();
}

/* ---------- Activity log (append-only) ---------- */
const COLL = {tx:"tx", account:"accounts", goal:"goals", investment:"inv", property:"props", business:"biz", debt:"debts", held:"held", recur:"recur"};
const KIND_LABEL = {tx:"Transaction", account:"Account", goal:"Goal", investment:"Investment", property:"Property", business:"Business", debt:"Debt", held:"Money held for someone", recur:"Recurring item", security:"App lock", rate:"Dollar rate", budget:"Budget", category:"Category"};
function clone(o){ return o==null ? o : JSON.parse(JSON.stringify(o)); }
let PREV = clone(S), pendingRestore = null;
function saveLog(){ try { localStorage.setItem(LOG_KEY, JSON.stringify(LOG)); } catch(e) {} }
function monthOf(ts){ const d = new Date(ts); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function logChunks(m){
  const items = LOG.filter(e => monthOf(e.ts)===m).sort((a,b)=>a.ts-b.ts);
  const chunks = []; let cur = [], size = 0;
  items.forEach(e => { const n = JSON.stringify(e).length; if (cur.length && size+n > 200000){ chunks.push(cur); cur = []; size = 0; } cur.push(e); size += n; });
  if (cur.length) chunks.push(cur);
  return chunks;
}
function stable(v){
  if (Array.isArray(v)) return "["+v.map(stable).join(",")+"]";
  if (v && typeof v==="object") return "{"+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+":"+stable(v[k])).join(",")+"}";
  return JSON.stringify(v===undefined?null:v);
}
function audit(){
  const out = [];
  Object.entries(COLL).forEach(([kind, c]) => {
    const pm = new Map((PREV[c]||[]).map(x => [x.id, x])), cm = new Map((S[c]||[]).map(x => [x.id, x]));
    cm.forEach((x, id) => { const p = pm.get(id); if (!p) out.push({action:"added", kind, before:null, after:clone(x)}); else if (stable(p)!==stable(x)) out.push({action:"edited", kind, before:clone(p), after:clone(x)}); });
    pm.forEach((p, id) => { if (!cm.has(id)) out.push({action:"deleted", kind, before:clone(p), after:null}); });
  });
  if (JSON.stringify(PREV.fx||{})!==JSON.stringify(S.fx||{})) out.push({action:"edited", kind:"rate", before:clone(PREV.fx), after:clone(S.fx)});
  const pb = PREV.budgets||{}, cb = S.budgets||{};
  new Set([...Object.keys(pb), ...Object.keys(cb)]).forEach(k => { const b = pb[k], a = cb[k]; if (b!==a) out.push({action: b==null?"added":a==null?"deleted":"edited", kind:"budget", before: b==null?null:{category:k, limit:b}, after: a==null?null:{category:k, limit:a}}); });
  ["expense","income"].forEach(t => {
    const was = new Set((PREV.cats||{})[t]||[]), now = new Set(S.cats[t]);
    now.forEach(n => { if (!was.has(n)) out.push({action:"added", kind:"category", before:null, after:{name:n, group:t}}); });
    was.forEach(n => { if (!now.has(n)) out.push({action:"deleted", kind:"category", before:{name:n, group:t}, after:null}); });
  });
  if (stable(PREV.lock||null)!==stable(S.lock||null)) out.push({action: !PREV.lock?"added":!S.lock?"deleted":"edited", kind:"security", before:null, after:null, label:"PIN, password or auto-lock settings"});
  if (out.length){
    const now = Date.now();
    out.forEach((e, i) => {
      e.id = uid(); e.ts = now + i;
      if (pendingRestore && COLL[e.kind]){ e.action = "restored"; e.ref = pendingRestore; }
      e.label = e.label || itemLabel(e.kind, e.after || e.before);
      LOG.push(e); dirty.logs.add(monthOf(e.ts));
    });
    saveLog();
  }
  pendingRestore = null;
  PREV = clone(S);
}
function itemLabel(kind, o){
  if (!o) return "";
  if (kind==="held") return (o.owner||"")+(o.purpose?" · "+o.purpose:"");
  if (kind==="tx"){ const a = acct(o.accountId); const t = o.type==="income"?"Money in":o.type==="expense"?"Money out":o.type==="custody"?(o.dir==="in"?"Held money received":"Held money handed over"):"Transfer"; return t+" "+money(o.amount, a?a.currency:"GHS")+(o.note||o.category?" · "+(o.note||o.category):"")+" · "+(o.date||""); }
  if (kind==="rate") return o.mode==="manual" ? (o.USD ? "My own rate: US$1 = GH₵ "+o.USD : "My own rate") : "Automatic reference rate";
  if (kind==="budget") return o.category+": "+money(o.limit);
  if (kind==="category") return o.name+" ("+(o.group==="income"?"income":"spending")+")";
  return o.name || "";
}
function onWriteError(err){
  const code = err && err.code;
  if (code === "quota_exceeded") toast("Storage is full. Export your data, then delete old entries.");
  else if (code === "invalid_argument" || code === "revoked" || code === "not_granted") { db = null; setMode("local"); toast("Couldn’t sync. Your changes are kept on this device."); }
  else if (code && code!=="unavailable") toast("Couldn’t sync that change ("+code+"). It’s saved on this device; Bese will retry.");
  if (code === "unavailable") setTimeout(() => { if (db){ dirty.core = true; S.tx.forEach(t=>dirty.months.add(t.date.slice(0,7))); LOG.forEach(e=>dirty.logs.add(monthOf(e.ts))); flush(); } }, 1500 + Math.random()*1000);
}
function onSnap(snap){
  const first = !syncReady; syncReady = true;
  if (flushTimer){ if (first) setTimeout(render, 0); return; } // local edits waiting to be sent win
  if (snap.empty){
    // first time on this account: upload anything already on this device
    const hasLocal = S.tx.length || S.goals.length || S.inv.length || S.props.length || S.biz.length || S.debts.length || S.held.length || S.recur.length || LOG.length;
    if (hasLocal){ dirty.core = true; S.tx.forEach(t => dirty.months.add(t.date.slice(0,7))); LOG.forEach(e => dirty.logs.add(monthOf(e.ts))); flush(); }
    return;
  }
  let core = null; const tx = [], remoteLog = [];
  snap.docs.forEach(d => {
    const body = d.data(); if (!body) return;
    if (d.id === "core") core = body;
    else if (d.id.indexOf("tx-")===0 && Array.isArray(body.items)) body.items.forEach(t => tx.push(Object.assign({}, t)));
    else if (d.id.indexOf("log-")===0 && Array.isArray(body.items)) body.items.forEach(e => remoteLog.push(clone(e)));
  });
  const merged = normalize(Object.assign({}, core ? JSON.parse(JSON.stringify(core)) : coreBody(), {tx}));
  S = merged; PREV = clone(S); saveLocal();
  const ids = new Set(remoteLog.map(e => e.id));
  const localOnly = LOG.filter(e => !ids.has(e.id));
  LOG = remoteLog.concat(localOnly).sort((a,b)=>a.ts-b.ts); saveLog();
  if (localOnly.length){ localOnly.forEach(e => dirty.logs.add(monthOf(e.ts))); flush(); }
  render();
}
function setMode(m){
  mode = m;
  document.getElementById("savedNote").textContent = m === "cloud" ? "Synced to your account" : "Saved on this device";
}
let syncReady = false;
function markSyncReady(){ if (!syncReady){ syncReady = true; setTimeout(render, 0); } }
(async function connect(){
  if (!window.claude || typeof window.claude.use !== "function"){ markSyncReady(); return; }
  try {
    const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!d || !u){ markSyncReady(); return; }
    const id = await u.id();
    if (!id){ markSyncReady(); return; }
    db = d; base = "data/users/" + id; setMode("cloud");
    db.collection(base).onSnapshot(onSnap, () => { db = null; setMode("local"); markSyncReady(); });
    try { d.doc("fx/reference").onSnapshot(sn => { refFx = sn && sn.exists ? sn.data() : null; render(); }, () => {}); } catch(e){}
  } catch(e) { db = null; setMode("local"); markSyncReady(); }
})();

/* ---------- Helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const nf = new Intl.NumberFormat("en-GH",{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat("en-GH",{maximumFractionDigits:0});
const CURS = {GHS:{sym:"GH₵",name:"Ghana cedi"}, USD:{sym:"US$",name:"US dollar"}, GBP:{sym:"£",name:"British pound"}, EUR:{sym:"€",name:"Euro"}, NGN:{sym:"₦",name:"Nigerian naira"}, KES:{sym:"KSh",name:"Kenyan shilling"}, ZAR:{sym:"R",name:"South African rand"}, XOF:{sym:"CFA",name:"CFA franc"}};
function sym(cur){ return (CURS[cur]||{}).sym || cur || "GH₵"; }
function curName(cur){ return (CURS[cur]||{}).name || cur; }
function curOptions(sel){ sel = sel || "GHS"; return Object.keys(CURS).map(c => `<option value="${c}" ${c===sel?"selected":""}>${esc(CURS[c].name)} (${esc(CURS[c].sym)})</option>`).join(""); }
function money(n, cur){ n = Number(n)||0; return (n<0?"−":"") + sym(cur||"GHS") + " " + nf.format(Math.abs(n)); }
function moneyShort(n){ n=Number(n)||0; const a=Math.abs(n); const s = a>=1e6 ? nf.format(a/1e6).replace(/\.?0+$/,"")+"m" : a>=1e4 ? nf0.format(a/1e3)+"k" : nf0.format(a); return (n<0?"−":"")+s; }
let refFx = null;
const STANDALONE = !(window.claude && typeof window.claude.use === "function");
const BUILTIN_FX = {date:"2026-10-28", source:"Built-in rates (Bank of Ghana and cross rates)", USD:11.6258, rates:{USD:11.6258, EUR:12.9455, GBP:15.4647, NGN:0.008637, KES:0.089491, ZAR:0.70323, XOF:0.019735}};
function fxSrc(){ return refFx || BUILTIN_FX; }
function refRate(cur){ const f = fxSrc(); const r = f.rates && Number(f.rates[cur]); return r>0 ? r : (cur==="USD" && Number(f.USD)>0 ? Number(f.USD) : 0); }
function fxMode(cur){ return (S.fx.modes && S.fx.modes[cur]) || (cur==="USD" && S.fx.mode) || "auto"; }
function fxOwn(cur){ const o = S.fx.own && Number(S.fx.own[cur]); return o>0 ? o : (cur==="USD" && Number(S.fx.USD)>0 ? Number(S.fx.USD) : 0); }
function rateOf(cur){ if (!cur || cur==="GHS") return 1; const own = fxOwn(cur), ref = refRate(cur); return (fxMode(cur)==="manual" ? (own || ref) : (ref || own)) || null; }
function rateAuto(cur){ return fxMode(cur)!=="manual" && refRate(cur)>0; }
function usdRate(){ return rateOf("USD"); }
function rateIsAuto(){ return rateAuto("USD"); }
function toGHS(n, cur){ n = Number(n)||0; const r = rateOf(cur||"GHS"); return r ? n*r : null; }
function fromGHS(n, cur){ const r = rateOf(cur||"GHS"); return r ? (Number(n)||0)/r : null; }
function dispCur(){ const c = (S.prefs && S.prefs.cur) || "GHS"; return rateOf(c) ? c : "GHS"; }
function moneyD(nGHS, cur){ cur = cur || dispCur(); const v = fromGHS(nGHS, cur); return v==null ? money(nGHS) : money(v, cur); }
function moneyShortD(nGHS, cur){ cur = cur || dispCur(); const v = fromGHS(nGHS, cur); return v==null ? moneyShort(nGHS) : moneyShort(v); }
function acct(id){ return S.accounts.find(a => a.id===id); }
function monthLabel(m){ const [y,mo] = m.split("-").map(Number); return new Date(y,mo-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"}); }
function shiftMonth(m, k){ let [y,mo] = m.split("-").map(Number); mo += k; while(mo<1){mo+=12;y--;} while(mo>12){mo-=12;y++;} return y+"-"+String(mo).padStart(2,"0"); }
function dayLabel(d){ const dt = new Date(d+"T00:00:00"); const t = today(); if (d===t) return "Today"; if (d===shiftDay(t,-1)) return "Yesterday"; return dt.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}); }
function shiftDay(d,k){ const dt=new Date(d+"T00:00:00"); dt.setDate(dt.getDate()+k); return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"); }
function daysUntil(d){ if(!d) return null; return Math.round((new Date(d+"T00:00:00") - new Date(today()+"T00:00:00"))/86400000); }
function initials(s){ return String(s||"?").replace(/[^A-Za-z ]/g,"").split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase() || "•"; }
function armed(btn, label){
  if (btn.dataset.armed === "1") return true;
  const orig = btn.textContent;
  btn.dataset.armed = "1"; btn.classList.add("armed"); btn.textContent = label || "Tap again to delete";
  setTimeout(() => { if (btn.isConnected && btn.dataset.armed === "1"){ delete btn.dataset.armed; btn.classList.remove("armed"); btn.textContent = orig; } }, 4000);
  return false;
}
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2600); }

function balance(a, list){
  let b = Number(a.opening)||0;
  (list||S.tx).forEach(t => {
    if (bounced(t)) return;
    const amt = Number(t.amount)||0;
    if (t.type==="income" && t.accountId===a.id) b += amt;
    else if (t.type==="expense" && t.accountId===a.id) b -= amt;
    else if (t.type==="custody" && t.accountId===a.id) b += t.dir==="in" ? amt : -amt;
    else if (t.type==="transfer"){
      if (t.accountId===a.id) b -= amt;
      if (t.toAccountId===a.id) b += (t.toAmount!=null && t.toAmount!=="" ? Number(t.toAmount) : amt);
    }
  });
  return b;
}
function txGHS(t){ const a = acct(t.accountId); return toGHS(t.amount, a ? a.currency : "GHS"); }
function monthTotals(m){
  let inc=0, exp=0; const byCat = {};
  S.tx.forEach(t => {
    if (t.date.slice(0,7)!==m || bounced(t)) return;
    const v = txGHS(t); if (v==null) return;
    if (t.type==="income") inc += v;
    else if (t.type==="expense"){ exp += v; byCat[t.category] = (byCat[t.category]||0) + v; }
  });
  return {inc, exp, byCat};
}
function missingRates(){ const set = new Set(); [S.accounts, S.inv, S.props, S.biz, S.debts, S.held].forEach(list => list.forEach(x => { if (x.currency && x.currency!=="GHS" && !rateOf(x.currency)) set.add(x.currency); })); return [...set]; }
function usdMissing(){ return missingRates().length>0; }
function bounced(t){ return !!(t.chq && t.chq.status==="bounced"); }
function chqPending(t){ return !!(t.chq && t.chq.status==="pending"); }
function heldBal(h, exceptTxId){ let b = Number(h.opening)||0; S.tx.forEach(t => { if (t.type==="custody" && t.heldId===h.id && t.id!==exceptTxId && !bounced(t)) b += t.dir==="in" ? (Number(t.amount)||0) : -(Number(t.amount)||0); }); return b; }
function heldTotalGHS(){ let t=0; S.held.forEach(h => { const v = toGHS(Math.max(0, heldBal(h)), h.currency); if (v!=null) t += v; }); return t; }
function heldWhere(hid){
  const m = {};
  S.tx.forEach(t => { if (t.type==="custody" && t.heldId===hid) m[t.accountId] = (m[t.accountId]||0) + (t.dir==="in"?1:-1)*(Number(t.amount)||0); });
  let best = null, bv = 0.004;
  Object.entries(m).forEach(([k,v]) => { if (v>bv && acct(k)){ best = k; bv = v; } });
  return best;
}
function debtBal(d){ return Math.max(0, Number(d.balance)||0); }
function debtsTotalGHS(){ let t=0, skipped=false; S.debts.forEach(d => { const v = toGHS(debtBal(d), d.currency); if (v==null) skipped=true; else t += v; }); return {t, skipped}; }
function nextDue(d){
  const day = Number(d.dueDay); if (!(day>=1 && day<=31) || debtBal(d)<=0) return null;
  const t = new Date(today()+"T00:00:00");
  for (let k=0;k<2;k++){
    const y = t.getFullYear(), m = t.getMonth()+k;
    const last = new Date(y, m+1, 0).getDate();
    const dt = new Date(y, m, Math.min(day,last));
    if (dt >= t) return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
  }
  return null;
}
function propVal(p){ return p.value!=null && p.value!=="" ? Number(p.value)||0 : (Number(p.price)||0); }
function parseCoords(s){
  s = String(s||""); try { s = decodeURIComponent(s); } catch(e) {}
  const m = s.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/) || s.match(/[?&](?:q|query|ll|destination)=(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/) || s.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/) || s.match(/^\s*(-?\d{1,2}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)\s*$/);
  if (!m) return null;
  const lat = Number(m[1]), lng = Number(m[2]);
  if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat)>90 || Math.abs(lng)>180) return null;
  return {lat, lng};
}
function mapsUrl(p){
  const c = parseCoords(p.map); if (c) return "https://www.google.com/maps?q="+c.lat+","+c.lng;
  const m = String(p.map||"").trim();
  if (/^https:\/\/(www\.)?(google\.[a-z.]+\/maps|maps\.google\.[a-z.]+|maps\.app\.goo\.gl|goo\.gl\/maps)/i.test(m)) return m;
  if (p.address) return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.address);
  return null;
}
function dirUrl(p){ const c = parseCoords(p.map); return c ? "https://www.google.com/maps/dir/?api=1&destination="+c.lat+","+c.lng : null; }
function fmtDate(d){ return d ? new Date(d+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : ""; }
function kv(k, v, cls){ return v ? `<dt>${esc(k)}</dt><dd${cls?` class="${cls}"`:""}>${esc(v)}</dd>` : ""; }
function opts(o, sel){ return Object.entries(o).map(([k,l])=>`<option value="${k}" ${k===sel?"selected":""}>${esc(l)}</option>`).join(""); }

/* ---------- Views ---------- */
function monthNav(){
  return `<div class="monthnav"><button class="iconbtn" data-action="month" data-k="-1" aria-label="Previous month">‹</button><strong>${esc(monthLabel(viewMonth))}</strong><button class="iconbtn" data-action="month" data-k="1" aria-label="Next month">›</button></div>`;
}
function fxBanner(){
  const m = missingRates();
  return m.length ? `<div class="banner">You have items in ${esc(m.map(curName).join(", "))} with no exchange rate. Set ${m.length===1?"a rate":"rates"} so your totals include them.<button class="btn small" data-action="go" data-to="setup">Set rates</button></div>` : "";
}

function viewOverview(){
  // net worth
  const groups = {};
  let total = 0;
  S.accounts.forEach(a => { const v = toGHS(balance(a), a.currency); if (v==null) return; const k = ACCOUNT_TYPES[a.type]||"Other"; groups[k]=(groups[k]||0)+v; total+=v; });
  let invTotal = 0; S.inv.forEach(i => { const v = toGHS(i.value!=null&&i.value!==""?i.value:i.principal, i.currency); if (v!=null) invTotal += v; });
  if (invTotal) { groups["Investments"] = invTotal; total += invTotal; }
  let propTotal = 0; S.props.forEach(p => { if (p.status==="sold") return; const v = toGHS(propVal(p), p.currency); if (v!=null) propTotal += v; });
  if (propTotal) { groups["Property"] = propTotal; total += propTotal; }
  let bizTotal = 0; S.biz.forEach(b => { if (b.status==="closed") return; const v = toGHS(b.value, b.currency); if (v!=null) bizTotal += v; });
  if (bizTotal) { groups["Businesses"] = bizTotal; total += bizTotal; }
  const owed = debtsTotalGHS().t, holding = heldTotalGHS(), net = total - owed - holding;
  const dueSoon = S.debts.map(d => ({d, due:nextDue(d)})).filter(x => x.due && daysUntil(x.due)<=7 && !S.recur.some(r => r.active && r.type==="loan" && r.debtId===x.d.id)).sort((a,b)=>a.due.localeCompare(b.due));
  const colors = ["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)","var(--s6)"];
  const parts = Object.entries(groups).filter(([,v])=>v>0);
  const posSum = parts.reduce((s,[,v])=>s+v,0);
  const strip = posSum>0 ? parts.map(([k,v],i)=>`<span style="width:${(v/posSum*100).toFixed(2)}%;background:${colors[i%6]}" title="${esc(k)}"></span>`).join("") : "";
  const legend = parts.map(([k,v],i)=>`<span><i class="dot" style="background:${colors[i%6]}"></i>${esc(k)} <b>${moneyShortD(v)}</b></span>`).join("");

  const m = monthTotals(viewMonth);
  const kept = m.inc - m.exp;
  const rate = m.inc>0 ? Math.round(kept/m.inc*100) : null;

  const cats = Object.entries(m.byCat).sort((a,b)=>b[1]-a[1]);
  const maxCat = cats.length ? Math.max(...cats.map(c=>Math.max(c[1], Number(S.budgets[c[0]])||0))) : 1;
  const catRows = cats.slice(0,8).map(([c,v]) => {
    const lim = Number(S.budgets[c])||0;
    const cls = lim ? (v>lim?"over":v>lim*.85?"warn":"") : "";
    return `<div class="bar-row"><span>${esc(c)}${lim?` <span class="muted small">of ${moneyShort(lim)}</span>`:""}</span><span class="amt">${money(v)}</span><div class="track"><i class="${cls}" style="width:${Math.min(100,v/maxCat*100).toFixed(1)}%"></i></div></div>`;
  }).join("");

  const upcoming = S.inv.filter(i => { const d = daysUntil(i.maturity); return d!=null && d>=0 && d<=30; }).sort((a,b)=>a.maturity.localeCompare(b.maturity));
  const recent = S.tx.slice().sort((a,b)=>b.date.localeCompare(a.date) || (b.ts||0)-(a.ts||0)).slice(0,5);

  const fresh = !S.tx.length && !S.inv.length && !S.props.length && !hasSample();
  return `${fxBanner()}${checkBanner()}
  ${STANDALONE && !bannerHidden() ? `<div class="banner" style="background:var(--green-soft)"><button class="linkbtn" data-action="hide-banner" aria-label="Hide this message" style="float:right;margin-left:8px">✕</button><strong>Bese test version.</strong> Everything you enter stays in this browser on this device; nothing is sent anywhere.${fresh ? ` Want to look around first?<button class="btn small" data-action="sample-load">Load sample data</button>` : ""}</div>` : (fresh ? `<div class="banner" style="background:var(--green-soft)">New to Bese? Explore it with realistic sample figures first, then remove them in Setup.<button class="btn small" data-action="sample-load">Load sample data</button></div>` : "")}
  <section class="hero">
    <div class="hero-label">What you’re worth today</div>
    <div class="row" style="gap:8px;align-items:center;margin-top:4px"><select class="input" id="nwCur" aria-label="Show net worth in" style="width:auto;padding:4px 8px;font-size:.85rem">${Object.keys(CURS).filter(c => rateOf(c)).map(c=>`<option value="${c}" ${c===dispCur()?"selected":""}>${esc(CURS[c].sym)} ${c}</option>`).join("")}</select><span class="small muted">Show my worth in another currency</span></div>
    <div class="hero-num"><small>${esc(sym(dispCur()))}</small>${net<0?"−":""}${nf.format(Math.abs(fromGHS(net, dispCur())||0))}</div>
    <div class="small muted" style="margin:-10px 0 16px">${Object.keys(CURS).filter(c => c!==dispCur() && ["GHS","USD","GBP","EUR"].includes(c) && rateOf(c)).map(c => "≈ "+money(fromGHS(net, c), c)).join(" · ")}</div>
    ${strip ? `<div class="strip" role="img" aria-label="Where your money sits">${strip}</div><div class="legend">${legend}</div>` : `<p class="muted">Add your account balances to see where your money sits.</p>`}
    ${owed>0 || holding>0 ? `<p class="owe">You have <strong>${moneyD(total)}</strong>${owed>0?`, owe <strong class="neg">${moneyD(owed)}</strong>`:""}${holding>0?`${owed>0?",":""} and are holding <strong>${moneyD(holding)}</strong> that belongs to others`:""}. <button class="linkbtn" data-action="go" data-to="debts">Details</button></p>` : ""}
  </section>

  <section class="section">
    <div class="section-head"><h2>This month</h2>${monthNav()}</div>
    <div class="stats">
      <div class="stat"><div class="k">Money in</div><div class="v pos">${money(m.inc)}</div></div>
      <div class="stat"><div class="k">Money out</div><div class="v neg">${money(m.exp)}</div></div>
      <div class="stat"><div class="k">Kept${rate!=null?` (${rate}% of income)`:""}</div><div class="v ${kept<0?"neg":""}">${money(kept)}</div></div>
    </div>
  </section>

  <div class="grid2 section">
    <section>
      <div class="section-head"><h2>Where it went</h2><button class="linkbtn" data-action="go" data-to="budgets">Set budgets</button></div>
      ${cats.length ? `<div class="panel">${catRows}</div>` : `<div class="empty"><p>No spending recorded for ${esc(monthLabel(viewMonth))}.</p><button class="btn primary" data-action="add-tx">Add a transaction</button></div>`}
    </section>
    <section>
      <div class="section-head"><h2>Last 6 months</h2></div>
      <div class="panel chart">${sixMonthChart()}</div>
    </section>
  </div>

  ${comingUp()}
  ${S.tx.some(chqPending) ? `<section class="section">${chequeSection(true)}</section>` : ""}
  ${dueSoon.length ? `<section class="section"><div class="section-head"><h2>Repayments due this week</h2><button class="linkbtn" data-action="go" data-to="debts">All debts</button></div>
    <div class="list">${dueSoon.map(x => `<div class="item"><span class="badge out" aria-hidden="true">${esc(initials(x.d.lender||x.d.name))}</span><span class="main"><span class="title">${esc(x.d.name)}</span><span class="sub">${esc(x.d.lender||"")} · due ${esc(dayLabel(x.due))}</span></span><span class="amt">${Number(x.d.payment)?money(x.d.payment, x.d.currency):""}</span></div>`).join("")}</div></section>` : ""}
  ${upcoming.length ? `<section class="section"><div class="section-head"><h2>Maturing soon</h2><button class="linkbtn" data-action="go" data-to="investments">All investments</button></div>
    <div class="list">${upcoming.map(invRow).join("")}</div></section>` : ""}

  <section class="section">
    <div class="section-head"><h2>Recent</h2>${recent.length?`<button class="linkbtn" data-action="go" data-to="transactions">See all</button>`:""}</div>
    ${recent.length ? `<div class="list">${recent.map(txRow).join("")}</div>` : `<div class="empty"><p>Your transactions will show up here.</p><button class="btn primary" data-action="add-tx">Add your first one</button></div>`}
  </section>`;
}

function sixMonthChart(){
  const months = []; for (let k=5;k>=0;k--) months.push(shiftMonth(viewMonth,-k));
  const data = months.map(m => { const t = monthTotals(m); return {m, inc:t.inc, exp:t.exp}; });
  const max = Math.max(1, ...data.map(d=>Math.max(d.inc,d.exp)));
  const W=360, H=180, padB=24, padT=10, gw=W/6, bw=Math.min(18, gw/3.2);
  let bars = "";
  data.forEach((d,i) => {
    const x = i*gw + gw/2;
    const hi = (d.inc/max)*(H-padB-padT), he = (d.exp/max)*(H-padB-padT);
    bars += `<rect x="${(x-bw-1).toFixed(1)}" y="${(H-padB-hi).toFixed(1)}" width="${bw}" height="${Math.max(0,hi).toFixed(1)}" rx="2" fill="var(--green)"><title>${esc(monthLabel(d.m))} in: ${money(d.inc)}</title></rect>`;
    bars += `<rect x="${(x+1).toFixed(1)}" y="${(H-padB-he).toFixed(1)}" width="${bw}" height="${Math.max(0,he).toFixed(1)}" rx="2" fill="var(--red)" opacity=".8"><title>${esc(monthLabel(d.m))} out: ${money(d.exp)}</title></rect>`;
    const [y,mo] = d.m.split("-").map(Number);
    bars += `<text x="${x.toFixed(1)}" y="${H-6}" text-anchor="middle">${new Date(y,mo-1,1).toLocaleDateString("en-GB",{month:"short"})}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Money in and out over six months"><line x1="0" x2="${W}" y1="${H-padB}" y2="${H-padB}" stroke="var(--line)"/>${bars}</svg>
  <div class="legend small"><span><i class="dot" style="background:var(--green)"></i>Money in</span><span><i class="dot" style="background:var(--red)"></i>Money out</span></div>`;
}

function txRow(t){
  const a = acct(t.accountId), to = acct(t.toAccountId);
  const cur = a ? a.currency : "GHS";
  let cls, sign, title, sub;
  if (t.type==="income"){ cls="in"; sign="+"; title=t.note||t.category; sub=t.category+" · "+(a?a.name:"—")+(t.src==="receipt"?" · scanned":"")+(t.src==="sms"?" · from SMS":"")+(t.src==="statement"?" · from statement":"")+(t.recurId?" · recurring":""); }
  else if (t.type==="expense"){ cls="out"; sign="−"; title=t.note||t.category; sub=t.category+" · "+(a?a.name:"—")+(t.src==="receipt"?" · scanned":"")+(t.src==="sms"?" · from SMS":"")+(t.src==="statement"?" · from statement":"")+(t.recurId?" · recurring":""); }
  else if (t.type==="custody"){ const h = S.held.find(x=>x.id===t.heldId); const who = h ? h.owner : "someone"; cls="rs"; sign = t.dir==="in" ? "+" : "−"; title = t.note || (t.dir==="in" ? "Received for "+who : "Handed over for "+who); sub = "Not yours · "+(h&&h.purpose?h.purpose+" · ":"")+(a?a.name:"—"); }
  else { cls="tr"; sign=""; title=t.note||"Transfer"; sub=(a?a.name:"—")+" to "+(to?to.name:"—")+(t.src==="receipt"?" · scanned":"")+(t.src==="sms"?" · from SMS":"")+(t.src==="statement"?" · from statement":""); }
  const label = t.type==="transfer" ? "⇄" : t.type==="custody" ? "HF" : initials(t.category);
  const ctag = chqPending(t) ? `<span class="tag">Not yet cleared</span>` : bounced(t) ? `<span class="tag red">Bounced</span>` : (t.chq && t.chq.status==="cleared") ? `<span class="tag green">Cleared</span>` : "";
  return `<button class="item" data-action="edit-tx" data-id="${esc(t.id)}"><span class="badge ${cls}" aria-hidden="true">${esc(label)}</span><span class="main"><span class="title">${esc(title)}${ctag}</span><span class="sub">${esc(sub)}</span></span><span class="amt ${cls==="in"?"pos":""}" ${bounced(t)?`style="text-decoration:line-through;opacity:.6"`:""}>${sign}${money(t.amount,cur).replace("−","")}</span></button>`;
}

function viewTransactions(){
  const q = txSearch.trim().toLowerCase();
  const list = S.tx.filter(t => t.date.slice(0,7)===viewMonth)
    .filter(t => txFilter==="all" || t.type===txFilter)
    .filter(t => !q || [t.note,t.category,(acct(t.accountId)||{}).name].join(" ").toLowerCase().includes(q))
    .sort((a,b)=>b.date.localeCompare(a.date) || (b.ts||0)-(a.ts||0));
  let html = "", lastDay = "";
  list.forEach(t => { if (t.date!==lastDay){ if (lastDay) html += `</div>`; html += `<div class="dayhead">${esc(dayLabel(t.date))}</div><div class="list">`; lastDay=t.date; } html += txRow(t); });
  if (lastDay) html += `</div>`;
  const f = (k,l)=>`<button data-action="filter" data-f="${k}" aria-pressed="${txFilter===k}">${l}</button>`;
  return `${fxBanner()}${chequeSection()}<div class="section-head"><h2>Transactions</h2>${monthNav()}</div>
  <div class="row wrap" style="margin-bottom:12px"><button class="btn small" data-action="stmt">📄 Import statement</button><button class="btn small" data-action="sms">💬 Paste SMS</button>${scanOK ? `<button class="btn small" data-action="scan">📷 Scan a receipt</button>` : ""}<span class="small muted">Log MoMo and bank messages or receipts in seconds</span></div>
  <div class="row wrap between"><div class="seg" role="group" aria-label="Filter">${f("all","All")}${f("expense","Out")}${f("income","In")}${f("transfer","Transfers")}${f("custody","For others")}</div>
  <input class="input search" id="txSearch" type="search" placeholder="Search notes or categories" value="${esc(txSearch)}" aria-label="Search transactions"></div>
  ${list.length ? html : `<div class="empty section"><p>Nothing here for ${esc(monthLabel(viewMonth))}${txFilter!=="all"||q?" with this filter":""}.</p><button class="btn primary" data-action="add-tx">Add a transaction</button></div>`}`;
}

function viewBudgets(){
  const m = monthTotals(viewMonth);
  const totalLim = S.cats.expense.reduce((s,c)=>s+(Number(S.budgets[c])||0),0);
  const rows = S.cats.expense.map(c => {
    const lim = Number(S.budgets[c])||0, spent = m.byCat[c]||0;
    const pct = lim ? spent/lim*100 : 0;
    const cls = lim ? (spent>lim?"over":pct>85?"warn":"") : "";
    const left = lim ? lim-spent : null;
    return `<div class="bar-row"><span>${esc(c)}<br><span class="muted small">${money(spent)} spent${lim?` · ${left>=0?money(left)+" left":money(-left)+" over"}`:""}</span></span>
      <span><input class="input" style="width:120px;text-align:right" inputmode="decimal" data-budget="${esc(c)}" value="${lim||""}" placeholder="No limit" aria-label="Monthly limit for ${esc(c)}"></span>
      ${lim?`<div class="track"><i class="${cls}" style="width:${Math.min(100,pct).toFixed(1)}%"></i></div>`:""}</div>`;
  }).join("");
  return `<div class="section-head"><h2>Budgets</h2>${monthNav()}</div>
  <p class="muted">Set a monthly limit in GH₵ for any category. Leave it blank for no limit.</p>
  <div class="stats"><div class="stat"><div class="k">Total budget</div><div class="v">${money(totalLim)}</div></div><div class="stat"><div class="k">Spent</div><div class="v neg">${money(m.exp)}</div></div><div class="stat"><div class="k">Left</div><div class="v ${totalLim-m.exp<0?"neg":""}">${totalLim?money(totalLim-m.exp):"—"}</div></div></div>
  <div class="panel section">${rows}</div>`;
}

function viewGoals(){
  const cards = S.goals.map(g => {
    const pct = g.target>0 ? Math.min(100, Math.round(g.saved/g.target*100)) : 0;
    const d = daysUntil(g.deadline);
    let pace = "";
    if (d!=null && d>0 && g.target>g.saved){ const months = Math.max(1, d/30.4); pace = `Save ${money((g.target-g.saved)/months)} a month to make it by ${new Date(g.deadline+"T00:00:00").toLocaleDateString("en-GB",{month:"short",year:"numeric"})}.`; }
    else if (g.saved>=g.target && g.target>0) pace = "Reached. Well done.";
    else if (d!=null && d<=0) pace = "The target date has passed.";
    return `<div class="panel goal"><div class="row between"><h3>${esc(g.name)}</h3><button class="linkbtn" data-action="edit-goal" data-id="${esc(g.id)}">Edit</button></div>
      <div class="row between" style="margin-top:10px;align-items:flex-end"><span class="pct">${pct}%</span><span class="muted small" style="text-align:right">${money(g.saved)}<br>of ${money(g.target)}</span></div>
      <div class="ring-track"><i style="width:${pct}%"></i></div>
      <p class="small muted" style="margin:0 0 12px">${esc(pace)}</p>
      <button class="btn small" data-action="fund-goal" data-id="${esc(g.id)}">Add money</button></div>`;
  }).join("");
  return `<div class="section-head"><h2>Savings goals</h2><button class="btn primary small" data-action="add-goal">New goal</button></div>
  ${S.goals.length ? `<div class="goals">${cards}</div>` : `<div class="empty"><p>Saving for school fees, a car, land or an emergency fund? Make it a goal and track it here.</p><button class="btn primary" data-action="add-goal">Create a goal</button></div>`}`;
}

function invRow(i){
  const val = i.value!=null && i.value!=="" ? Number(i.value) : Number(i.principal)||0;
  const gain = val - (Number(i.principal)||0);
  const d = daysUntil(i.maturity);
  let tag = "";
  if (d!=null){ if (d<0) tag = `<span class="tag red">Matured</span>`; else if (d<=14) tag = `<span class="tag">${d===0?"Matures today":"In "+d+" day"+(d===1?"":"s")}</span>`; }
  const sub = [INV_KINDS[i.kind]||"Other", i.rate?i.rate+"% a year":"", i.maturity?"matures "+new Date(i.maturity+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):""].filter(Boolean).join(" · ");
  return `<button class="item" data-action="edit-inv" data-id="${esc(i.id)}"><span class="badge" aria-hidden="true">${esc(initials(INV_KINDS[i.kind]||"Other"))}</span><span class="main"><span class="title">${esc(i.name)}${tag}</span><span class="sub">${esc(sub)}</span></span><span class="amt">${money(val,i.currency)}<br><span class="small ${gain>=0?"pos":"neg"}">${gain>=0?"+":"−"}${money(Math.abs(gain),i.currency).replace("−","")}</span></span></button>`;
}
function viewInvestments(){
  let p=0, v=0, skipped=false;
  S.inv.forEach(i => { const pp = toGHS(i.principal, i.currency), vv = toGHS(i.value!=null&&i.value!==""?i.value:i.principal, i.currency); if (pp==null||vv==null){ skipped=true; return; } p+=pp; v+=vv; });
  const g = v-p;
  const list = S.inv.slice().sort((a,b)=>(a.maturity||"9999").localeCompare(b.maturity||"9999"));

const FIELD = {amount:"Amount", toAmount:"Amount received", date:"Date", note:"Note", category:"Category", accountId:"Account", toAccountId:"To account", type:"Type", name:"Name", target:"Target", saved:"Saved", deadline:"Target date", principal:"Put in", value:"Worth now", rate:"Rate %", maturity:"Matures", currency:"Currency", opening:"Starting balance", kind:"Type", status:"Status", address:"Location", size:"Size", titleDoc:"Title document", titleRef:"Title ref", price:"Bought for", bought:"Acquired", rent:"Rent", map:"Map pin", share:"Share %", role:"Role", sector:"Sector", reg:"Registration no.", tin:"TIN", since:"Registered", next:"Next step", start:"Start", USD:"US$ rate", limit:"Limit", lender:"Owed to", original:"Borrowed", balance:"Outstanding", payment:"Monthly payment", dueDay:"Due day", end:"Ends", collateral:"Secured against", payments:"Payments", owner:"Whose money", purpose:"Purpose", dir:"Direction", heldId:"Held for", freq:"Repeats", nextDate:"Next date", mode:"Mode", active:"Active", day:"Day of month", debtId:"Loan", interest:"Interest part"};
function fmtField(kind, key, v){
  if (v==null || v==="") return "—";
  if (key==="accountId" || key==="toAccountId"){ const a = acct(v); return a ? a.name : "(deleted account)"; }
  if (key==="type" && kind==="tx") return v==="income"?"Money in":v==="expense"?"Money out":"Transfer";
  if (key==="type" && kind==="account") return ACCOUNT_TYPES[v]||v;
  if (key==="type" && kind==="business") return BIZ_TYPES[v]||v;
  if (key==="kind" && kind==="investment") return INV_KINDS[v]||v;
  if (key==="kind" && kind==="property") return PROP_KINDS[v]||v;
  if (key==="status") return (kind==="business"?BIZ_STATUS:PROP_STATUS)[v]||v;
  if (key==="titleDoc") return TITLE_DOCS[v]||v;
  if (key==="kind" && kind==="debt") return DEBT_KINDS[v]||v;
  if (key==="heldId"){ const h = S.held.find(x=>x.id===v); return h ? h.owner : "(removed)"; }
  if (key==="freq") return FREQ[v]||v;
  if (key==="mode" && kind==="rate") return v==="manual" ? "My own rate" : "Automatic";
  if (key==="mode") return v==="auto" ? "Adds automatically" : "Asks first";
  if (key==="active") return v ? "Yes" : "No";
  if (key==="debtId"){ const dd = S.debts.find(x=>x.id===v); return dd ? dd.name : "(removed)"; }
  if (key==="type" && kind==="recur") return {expense:"Money out", income:"Money in", transfer:"Transfer", loan:"Loan repayment"}[v]||v;
  if (key==="dir") return v==="in" ? "Received for them" : "Handed over / spent for them";
  if (key==="type" && kind==="tx" && v==="custody") return "For someone";
  if (key==="collateral"){ const pr = S.props.find(x=>x.id===v); return pr ? pr.name : (v==="other" ? "Other" : String(v)); }
  if (key==="lastCheck") return v && v.date ? "checked "+fmtDate(v.date)+(Math.abs(Number(v.diff)||0)>0.004 ? " (difference "+money(v.diff)+")" : " (matched)") : "—";
  if (key==="checks" && Array.isArray(v)) return v.length+" check"+(v.length===1?"":"s");
  if (Array.isArray(v)) return v.length+" payment"+(v.length===1?"":"s");
  if (typeof v==="number") return nf.format(v);
  const s = String(v); return s.length>60 ? s.slice(0,57)+"…" : s;
}
function changes(e){
  if (!e.before || !e.after) return [];
  const keys = new Set([...Object.keys(e.before), ...Object.keys(e.after)]);
  const out = [];
  keys.forEach(k => { if (k==="id"||k==="ts") return; if (stable(e.before[k])!==stable(e.after[k])) out.push((FIELD[k]||k)+": "+fmtField(e.kind,k,e.before[k])+" → "+fmtField(e.kind,k,e.after[k])); });
  return out.slice(0,8);
}
function canRestore(e, restoredRefs){
  const c = COLL[e.kind]; if (!c || restoredRefs.has(e.id)) return null;
  if (e.action==="deleted" && e.before && !S[c].some(x=>x.id===e.before.id)) return "Restore";
  if (e.action==="edited" && e.before && S[c].some(x=>x.id===e.before.id)) return "Undo edit";
  return null;
}
function viewActivity(){
  const restoredRefs = new Set(LOG.filter(e=>e.ref).map(e=>e.ref));
  const list = LOG.filter(e => (actFilter==="all" || e.action===actFilter) && (actKind==="all" || e.kind===actKind)).sort((a,b)=>b.ts-a.ts);
  const shown = list.slice(0, actLimit);
  const icon = {added:["+","in"], edited:["✎","tr"], deleted:["×","out"], restored:["↺","rs"]};
  const verb = {added:"added", edited:"edited", deleted:"deleted", restored:"restored"};
  let html = "", lastDay = "";
  shown.forEach(e => {
    const d = new Date(e.ts), day = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if (day!==lastDay){ if (lastDay) html += `</div>`; html += `<div class="dayhead">${esc(dayLabel(day))}</div><div class="list">`; lastDay = day; }
    const ic = icon[e.action]||["•",""], diffs = e.action==="edited"||e.action==="restored" ? changes(e) : [];
    const r = canRestore(e, restoredRefs);
    html += `<div class="item"><span class="badge ${ic[1]}" aria-hidden="true">${ic[0]}</span><span class="main"><span class="title">${esc((KIND_LABEL[e.kind]||"Item")+" "+(verb[e.action]||e.action))}</span><span class="sub">${esc(e.label)}</span>${diffs.length?`<div class="diff">${diffs.map(x=>`<div>${esc(x)}</div>`).join("")}</div>`:""}${restoredRefs.has(e.id)?`<div class="diff">Restored</div>`:""}</span>
      <span class="act-right"><span class="small muted">${d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}</span>${r?`<button class="btn small" data-action="restore" data-id="${esc(e.id)}">${r}</button>`:""}</span></div>`;
  });
  if (lastDay) html += `</div>`;
  const f = (k,l)=>`<button data-action="act-filter" data-f="${k}" aria-pressed="${actFilter===k}">${l}</button>`;
  const kinds = `<select class="input" id="actKind" style="max-width:200px" aria-label="Type of item"><option value="all">All items</option>${Object.entries(KIND_LABEL).map(([k,l])=>`<option value="${k}" ${actKind===k?"selected":""}>${esc(l)}</option>`).join("")}</select>`;
  return `<div class="section-head"><h2>Activity</h2><span class="small muted">${LOG.length} change${LOG.length===1?"":"s"} recorded</span></div>
  <div class="lock"><span aria-hidden="true">🔒</span><span>Every add, edit and delete is recorded here, with the values before and after. This history can’t be cleared from the app, including when you delete all your data.</span></div>
  <div class="row wrap between"><div class="seg" role="group" aria-label="Filter by action">${f("all","All")}${f("added","Added")}${f("edited","Edited")}${f("deleted","Deleted")}${f("restored","Restored")}</div>${kinds}</div>
  ${shown.length ? html : `<div class="empty section"><p>${LOG.length ? "No changes match this filter." : "Changes you make from now on will be recorded here."}</p></div>`}
  ${list.length>actLimit ? `<div style="text-align:center;margin-top:16px"><button class="btn" data-action="act-more">Show older changes</button></div>` : ""}`;
}
function restore(id){
  const e = LOG.find(x => x.id===id); if (!e) return;
  const c = COLL[e.kind]; if (!c || !e.before) return;
  const idx = S[c].findIndex(x => x.id===e.before.id);
  if (e.action==="deleted"){
    if (idx>=0){ toast("That item already exists."); return; }
    if (e.kind==="tx" && !acct(e.before.accountId)){ toast("Restore the account this transaction used first."); return; }
    if (e.kind==="tx" && e.before.type==="custody" && !S.held.some(h=>h.id===e.before.heldId)){ toast("Restore the record of whose money this was first."); return; }
    pendingRestore = e.id;
    S[c].push(clone(e.before));
    if (e.kind==="tx") markMonth(e.before.date.slice(0,7)); else markCore();
  } else if (e.action==="edited"){
    if (idx<0){ toast("This item has since been deleted. Restore the deletion first."); return; }
    const cur = S[c][idx];
    pendingRestore = e.id;
    S[c][idx] = clone(e.before);
    if (e.kind==="tx"){ markMonth(cur.date.slice(0,7)); markMonth(e.before.date.slice(0,7)); } else markCore();
  } else return;
  render(); toast("Restored");
}

    let rin=0, rout=0, last=null;
    S.tx.forEach(t => { if (t.type==="custody" && t.heldId===h.id){ if (t.dir==="in") rin += Number(t.amount)||0; else rout += Number(t.amount)||0; if (!last || t.date>last.date) last = t; } });
    const bal = heldBal(h);
    const where = {}; S.tx.forEach(t => { if (t.type==="custody" && t.heldId===h.id){ const a = acct(t.accountId); const k = a ? a.name : "—"; where[k] = (where[k]||0) + (t.dir==="in"?1:-1)*(Number(t.amount)||0); } });
    const whereTxt = Object.entries(where).filter(([,v])=>v>0.004).map(([k,v])=>k+" "+money(v,h.currency)).join(", ");
    return `<div class="panel"><div class="row between" style="align-items:flex-start"><div><h3>${esc(h.owner)}</h3><div class="small muted">${esc(h.purpose||"Money held for them")}</div></div>${bal<=0.004?`<span class="tag green">Settled</span>`:`<span class="tag">Holding</span>`}</div>
      <div class="card-val">${money(Math.max(0,bal), h.currency)}</div><div class="small muted">Still with you, not yours</div>
      <dl class="kv">${kv("Received", money(rin,h.currency))}${kv("Handed over", rout?money(rout,h.currency):"")}${kv("Kept in", whereTxt)}${kv("Last movement", last?fmtDate(last.date):"")}</dl>
      ${h.note ? `<p class="small muted" style="margin:0 0 12px">${esc(h.note)}</p>` : ""}
      <div class="row wrap"><button class="btn small" data-action="held-in" data-id="${esc(h.id)}">Received more</button>${bal>0.004?`<button class="btn small primary" data-action="held-out" data-id="${esc(h.id)}">Hand over</button>`:""}<button class="btn small" data-action="edit-held" data-id="${esc(h.id)}">Edit</button></div></div>`;
  }).join("");
  return `<div class="section"><div class="section-head"><h2>Money you’re holding for others</h2><button class="btn small" data-action="held-new">Record money received</button></div>
  <p class="muted">Money that sits in your cash, MoMo or bank account but belongs to someone else. It’s kept out of your income and taken off your net worth.${holding>0?` You’re holding <strong>${money(holding)}</strong> in total.`:""}</p>
  ${list.length ? `<div class="cards">${cards}</div>` : `<div class="empty"><p>Nothing recorded. Use this for family contributions, funds you’re keeping for someone, or money you’ve been asked to pass on.</p></div>`}</div>`;
}

/* ---------- App lock ---------- */
const LOCK_ITER = 150000;
let unlocked = false, lockMode = "pin", lastActive = Date.now(), hiddenAt = 0;
function needsLock(){ return !!(S.lock && S.lock.pin) && !unlocked; }
function b64(buf){ const a = new Uint8Array(buf); let s = ""; for (let i=0;i<a.length;i++) s += String.fromCharCode(a[i]); return btoa(s); }
function unb64(s){ return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
function rand(n){ const a = new Uint8Array(n); crypto.getRandomValues(a); return a; }
async function derive(secret, salt, iter){
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(secret), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2", salt:unb64(salt), iterations:iter, hash:"SHA-256"}, key, 256);
  return b64(bits);
}
async function makeSecret(secret){ const salt = b64(rand(16)); return {salt, hash: await derive(secret, salt, LOCK_ITER)}; }
async function checkSecret(rec, secret){ if (!rec || !secret) return false; return (await derive(secret, rec.salt, (S.lock&&S.lock.iter)||LOCK_ITER)) === rec.hash; }
function normCode(c){ return String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,""); }
function newRecoveryCode(){ const al = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", r = rand(12); let c = ""; for (let i=0;i<12;i++){ c += al[r[i]%al.length]; if (i===3||i===7) c += "-"; } return c; }
function bioId(){ try { return localStorage.getItem("sika:bio"); } catch(e){ return null; } }
function failState(){ try { return JSON.parse(localStorage.getItem("sika:lockfail")) || {n:0, until:0}; } catch(e){ return {n:0, until:0}; } }
function setFail(f){ try { localStorage.setItem("sika:lockfail", JSON.stringify(f)); } catch(e){} }
function registerFail(){ const f = failState(); f.n++; if (f.n>=5) f.until = Date.now() + 30000*Math.pow(2, f.n-5); setFail(f); return f; }
function waitLeft(){ const f = failState(); return Math.max(0, Math.ceil((f.until - Date.now())/1000)); }

function lockNow(){ if (!S.lock) return; unlocked = false; if (dlg.open) dlg.close(); const ls = document.getElementById("lockscreen"); delete ls.dataset.built; render(); }
function doUnlock(){ unlocked = true; setFail({n:0, until:0}); lastActive = Date.now(); const ls = document.getElementById("lockscreen"); delete ls.dataset.built; render(); }
function hideLock(){ const ls = document.getElementById("lockscreen"); if (!ls.hidden){ ls.hidden = true; ls.innerHTML = ""; delete ls.dataset.built; } document.body.classList.remove("locked"); }
function showLock(){
  const ls = document.getElementById("lockscreen");
  document.body.classList.add("locked"); document.getElementById("main").innerHTML = ""; if (dlg.open) dlg.close();
  ls.hidden = false;
  if (ls.dataset.built) return;
  ls.dataset.built = "1";
  if (!S.lock.pw) lockMode = "pin";
  drawLock(ls);
}
function drawLock(ls, recovery){
  const hasBio = !!bioId();
  const isPin = lockMode==="pin";
  ls.innerHTML = recovery ? `<div class="lock-card">
      <div class="logo"><span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="currentColor"><ellipse cx="50" cy="25" rx="15" ry="23"/><ellipse cx="50" cy="25" rx="15" ry="23" transform="rotate(90 50 50)"/><ellipse cx="50" cy="25" rx="15" ry="23" transform="rotate(180 50 50)"/><ellipse cx="50" cy="25" rx="15" ry="23" transform="rotate(270 50 50)"/></g><circle cx="50" cy="50" r="12" fill="var(--gold)"/><circle cx="50" cy="50" r="6" fill="none" stroke="var(--paper)" stroke-width="3"/></svg></span>Bese</div>
      <h1>Use your recovery code</h1><p class="muted">Enter the 12-character code you wrote down when you set up the lock.</p>
      <input class="input lock-input" id="lkInput" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX" style="letter-spacing:.08em;font-size:1.2rem">
      <button class="btn primary" id="lkGo">Continue</button>
      <div class="err" id="lkErr"></div>
      <div class="lock-links"><button class="linkbtn" id="lkBack">Back</button></div></div>`
    : `<div class="lock-card">
      <div class="logo"><span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="currentColor"><ellipse cx="50" cy="25" rx="15" ry="23"/><ellipse cx="50" cy="25" rx="15" ry="23" transform="rotate(90 50 50)"/><ellipse cx="50" cy="25" rx="15" ry="23" transform="rotate(180 50 50)"/><ellipse cx="50" cy="25" rx="15" ry="23" transform="rotate(270 50 50)"/></g><circle cx="50" cy="50" r="12" fill="var(--gold)"/><circle cx="50" cy="50" r="6" fill="none" stroke="var(--paper)" stroke-width="3"/></svg></span>Bese</div>
      <h1>Bese is locked</h1><p class="muted">${isPin ? "Enter your PIN to open." : "Enter your password to open."}</p>
      <input class="input lock-input" id="lkInput" type="password" ${isPin ? `inputmode="numeric" maxlength="6" placeholder="••••"` : `placeholder="Password" style="letter-spacing:normal;font-size:1.1rem"`} autocomplete="off" aria-label="${isPin?"PIN":"Password"}">
      <button class="btn primary" id="lkGo">Unlock</button>
      ${hasBio ? `<button class="btn" id="lkBio">Use fingerprint</button>` : ""}
      <div class="err" id="lkErr"></div>
      <div class="lock-links">${S.lock.pw ? `<button class="linkbtn" id="lkSwitch">${isPin ? "Use password instead" : "Use PIN instead"}</button>` : ""}<button class="linkbtn" id="lkForgot">Forgot ${isPin?"PIN":"password"}?</button></div></div>`;
  const inp = ls.querySelector("#lkInput"), err = ls.querySelector("#lkErr"), go = ls.querySelector("#lkGo");
  setTimeout(() => inp.focus(), 50);
  const blocked = () => { const s = waitLeft(); if (s>0){ err.textContent = "Too many wrong tries. Try again in "+s+" seconds."; return true; } return false; };
  const attempt = async () => {
    if (blocked()) return;
    const v = recovery ? normCode(inp.value) : inp.value;
    if (!v){ err.textContent = recovery ? "Enter your recovery code." : (isPin ? "Enter your PIN." : "Enter your password."); return; }
    go.disabled = true; err.textContent = "";
    let ok = false;
    try { ok = await checkSecret(recovery ? S.lock.rec : (isPin ? S.lock.pin : S.lock.pw), v); } catch(e){ ok = false; }
    go.disabled = false;
    if (ok){ if (recovery){ doUnlock(); lockDialog("reset"); } else doUnlock(); return; }
    const f = registerFail(); inp.value = ""; inp.focus();
    err.textContent = f.until > Date.now() ? "Too many wrong tries. Try again in "+waitLeft()+" seconds." : (recovery ? "That code doesn’t match." : (isPin ? "Wrong PIN." : "Wrong password."))+(f.n>=3 && f.n<5 ? " "+(5-f.n)+" tries left before a short wait." : "");
  };
  go.addEventListener("click", attempt);
  inp.addEventListener("keydown", e => { if (e.key==="Enter") attempt(); });
  const sw = ls.querySelector("#lkSwitch"); if (sw) sw.addEventListener("click", () => { lockMode = isPin ? "pw" : "pin"; drawLock(ls); });
  const fg = ls.querySelector("#lkForgot"); if (fg) fg.addEventListener("click", () => drawLock(ls, true));
  const bk = ls.querySelector("#lkBack"); if (bk) bk.addEventListener("click", () => drawLock(ls));
  const bio = ls.querySelector("#lkBio"); if (bio) bio.addEventListener("click", async () => {
    if (blocked()) return;
    try {
      await navigator.credentials.get({publicKey:{challenge:rand(32), allowCredentials:[{type:"public-key", id:unb64(bioId())}], userVerification:"required", timeout:60000}});
      doUnlock();
    } catch(e){ err.textContent = "Fingerprint didn’t work here. Use your "+(isPin?"PIN":"password")+"."; }
  });
}

  dlg.querySelector("#lSave").addEventListener("click", async () => {
