async function shrink(file){
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600/Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.85));
  } catch(e){ return file; }
}
function receiptPrompt(){
  return `You are reading a photo for a personal finance app used in Ghana. Extract the payment it shows and reply with ONLY a JSON object, no other text.

Fields:
- "is_receipt": true if the photo shows a receipt, invoice, bill, fuel pump display or slip, vending machine slip, POS slip, bank pay-in (deposit) slip, bank withdrawal slip, ATM slip, or a MoMo or bank transaction confirmation; otherwise false.
- "doc_type": one of:
  "purchase" (paying for goods or services: shop, fuel, vending, restaurant, bill),
  "bank_deposit" (a bank pay-in / deposit slip or deposit confirmation: money paid INTO a bank account),
  "bank_withdrawal" (a bank withdrawal slip or ATM withdrawal slip: cash taken OUT of a bank account),
  "momo_cashin" (cash given to a MoMo agent to load a wallet),
  "momo_cashout" (cash collected from a MoMo agent out of a wallet),
  "money_received" (a confirmation that someone else sent money to the user).
- "bank_name": the bank named on a bank slip, or null.
- "account_last4": ONLY the last 4 digits of the account number on a bank slip, or null. Never give the full account number.
- "depositor": the name of the person who paid the money in, if shown, or null.
- "funds_source": for deposits, "cash", "cheque" or "unknown".
- "cheque_number": for a cheque deposit, the cheque number, or null.
- "drawer": for a cheque deposit, the person or company who wrote the cheque (the payer), or null.
- "drawer_bank": for a cheque deposit, the bank the cheque is drawn on, or null.
- "merchant": shop, fuel station, restaurant or company name as printed, or null.
- "date": the transaction date as YYYY-MM-DD, or null if none is visible. Ghanaian receipts usually write dates day-first (DD/MM/YYYY). Today is ${today()}.
- "total": the final amount actually paid, deposited, withdrawn or received, as a plain number: the grand total after taxes, levies and discounts. For a fuel pump use the money amount, not litres. Null if you cannot read it clearly.
- "currency": "GHS" for cedis (GH₵, GH¢, GHC, GHS, ₵, or a C before amounts), "USD" for US dollars, otherwise the ISO code.
- "payment_method": one of "cash", "momo", "card", "bank", "unknown". Look for words such as CASH, MoMo, MTN, Telecel, AT Money, VISA, Mastercard, POS, CARD, transfer.
- "receipt_type": one of "fuel", "vending", "shop", "supermarket", "restaurant", "utility", "transport", "pharmacy", "other".
- "fuel_litres": litres bought for fuel, or null.
- "items_summary": up to 8 words describing what was bought, or null.
- "category": the closest match from this exact list: ${JSON.stringify(S.cats.expense)}.
- "confidence": "high", "medium" or "low" for how sure you are of the total.
- "notes_for_user": one short sentence if something is unclear (for example a blurred total or two possible totals), otherwise null.

Never guess a number you cannot read. Use null instead.`;
}
const TYPE_CAT = {fuel:["Transport & fuel"], transport:["Transport & fuel"], supermarket:["Food & groceries"], shop:["Food & groceries"], vending:["Food & groceries"], restaurant:["Food & groceries","Entertainment"], utility:["Utilities (ECG, water)"], pharmacy:["Health"]};
function pickAccount(method, cur){
  const want = {cash:"cash", momo:"momo", card:"card", bank:"bank"}[method];
  const same = a => a.currency===cur;
  return (want && (S.accounts.find(a=>a.type===want && same(a)) || S.accounts.find(a=>a.type===want)))
    || (method==="card" && (S.accounts.find(a=>a.type==="bank" && same(a)) || S.accounts.find(a=>a.type==="bank")))
    || S.accounts.find(same) || S.accounts[0];
}

const FREQ = {weekly:"Every week", biweekly:"Every 2 weeks", monthly:"Every month", quarterly:"Every 3 months", termly:"Every 4 months (school term)", halfyearly:"Every 6 months", yearly:"Every year"};
const FREQ_M = {monthly:1, quarterly:3, termly:4, halfyearly:6, yearly:12};
function ymd(y, m, d){ return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0"); }
function addMonthsAnchor(ds, n, day){ const [y,m] = ds.split("-").map(Number); let mm = m-1+n; const yy = y + Math.floor(mm/12); mm = ((mm%12)+12)%12; const last = new Date(yy, mm+1, 0).getDate(); return ymd(yy, mm+1, Math.min(day, last)); }

  if (S.tx.some(t => t.id===id)) return false;
  const amount = Number(over.amount!=null ? over.amount : r.amount)||0, date = over.date || sched, accountId = over.accountId || r.accountId;
  if (!(amount>0) || !acct(accountId)) return false;

function smsPrompt(text){
  return `You read SMS messages from mobile money services (MTN MoMo, Telecel Cash, AT Money) and banks in Ghana for a personal finance app. The text may contain one or several messages. Reply with ONLY a JSON object {"messages":[...]} with one object per transaction message. Ignore promotions, OTP codes and anything that is not a transaction.

Each object has:
- "kind": one of "payment_sent", "merchant_payment", "bill_payment", "airtime_data", "payment_received", "cash_in", "cash_out", "to_bank", "from_bank", "bank_debit", "bank_credit", "other".
  ("cash_in" = the user gave cash to an agent to load their wallet; "cash_out" = the user collected cash from an agent.)
- "amount": the main amount as a number, excluding fees.
- "fee": charges or fees as a number, else 0.
- "elevy": E-Levy or other tax as a number, else 0.
- "currency": "GHS" or another ISO code.
- "counterparty": the person or business name only. Never include phone numbers or account numbers. Null if none.
- "provider": "MTN MoMo", "Telecel Cash", "AT Money", or the bank's name.
- "bank_name": the other bank for transfers to or from a bank, else null.
- "date": YYYY-MM-DD, or null if absent. Ghanaian messages usually write dates day-first. Today is ${today()}.
- "txn_id": the transaction ID or reference number, else null.
- "balance_after": the balance stated after this transaction, else null.
- "reference": the payment reference or note typed by the sender, else null.
- "category": for money out, the best match from ${JSON.stringify(S.cats.expense)}; for money in, from ${JSON.stringify(S.cats.income)}.
Never invent values.

Messages:
"""
${text.slice(0, 8000)}
"""`;
}
function parseSmsLocal(text){
  const num2 = v => { const n = Number(String(v||"").replace(/,/g,"")); return isFinite(n) ? n : null; };
  const CUR = "(?:GHS|GH¢|GH₵|GHC|Ghc|¢|₵)";
  let chunks = text.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  if (chunks.length===1){ const parts = text.split(/(?=\b(?:Payment (?:made|received|for)|You have (?:received|sent|paid|withdrawn)|Cash (?:In|Out)|Your (?:payment|account|transfer))\b)/i).map(x=>x.trim()).filter(x=>x.length>15); if (parts.length>1) chunks = parts; }
  return chunks.map(c => {
    const amt = c.match(new RegExp(CUR+"\\s?([\\d,]+(?:\\.\\d{1,2})?)","i"));
    if (!amt) return null;
    const low = c.toLowerCase();
    let kind = "other";
    const bankish = /\b(acct|a\/c|account)\b|\bavl\.? bal|available bal|\bdr\b|\bcr\b|narration|desc:/.test(low) && !/momo|mobile money|wallet|telecel cash|at money/.test(low);
    if (bankish && /\b(debit(ed)?|dr)\b/.test(low) && !/\bcredit(ed)?\b/.test(low.split(/debit/)[0]||"")) kind = /atm|cash w(ith)?d|withdrawal/.test(low) ? "bank_debit" : "bank_debit";
    else if (bankish && /\b(credit(ed)?|cr)\b/.test(low)) kind = "bank_credit";
    else if (/cash\s?out|withdraw/.test(low)) kind = "cash_out";
    else if (/cash\s?in\b|deposit(ed)? to your (wallet|momo)/.test(low)) kind = "cash_in";
    else if (/airtime|bundle|data\b/.test(low)) kind = "airtime_data";
    else if (/received|credited|has been credited|you have been paid/.test(low)) kind = /bank|account no|a\/c/.test(low) && !/momo|wallet/.test(low) ? "bank_credit" : "payment_received";
    else if (/debited/.test(low)) kind = "bank_debit";
    else if (/payment (made|for)|paid|sent|transfer(red)?|purchase/.test(low)) kind = "payment_sent";
    const g = re => { const m = c.match(re); return m ? m[1] : null; };
    const fee = num2(g(new RegExp("fee(?:s)?(?: charged)?\\s*(?:is|of|:)?\\s*"+CUR+"?\\s*([\\d,]+(?:\\.\\d+)?)","i"))) || 0;
    const elevy = (num2(g(new RegExp("e-?levy(?: charged)?\\s*(?:is|of|:)?\\s*"+CUR+"?\\s*([\\d,]+(?:\\.\\d+)?)","i"))) || 0) + (num2(g(new RegExp("\\btax(?: charged)?\\s*(?:is|of|:)?\\s*"+CUR+"?\\s*([\\d,]+(?:\\.\\d+)?)","i"))) || 0);
    const bal = num2(g(new RegExp("(?:balance|\\bbal)\\.?(?: is)?\\s*:?\\s*"+CUR+"?\\s*([\\d,]+(?:\\.\\d+)?)","i")));
    const id = (g(/(?:financial transaction id|transaction id|trans(?:action)?\.? id|txn id)\s*[:#]?\s*([A-Za-z0-9]+(?:\.[A-Za-z0-9]+)*)/i) || g(/ref(?:erence)? no\.?\s*[:#]?\s*([A-Za-z0-9]{5,})/i));
    const reference = g(/\breference\s*:\s*([^.\n]{1,40})/i);
    let date = null;
    const d1 = c.match(/(\d{4})-(\d{2})-(\d{2})/), d2 = c.match(/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})\b/);
    const d3 = c.match(/\b(\d{1,2})[-\s\/.]?(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*[-\s\/.,]*(\d{2,4})\b/i);
    if (d1) date = d1[1]+"-"+d1[2]+"-"+d1[3];
    else if (d3){ const pd = parseDateAny(d3[1]+"-"+d3[2]+"-"+d3[3]); if (pd) date = pd; }
    else if (d2){ let y = d2[3]; if (y.length===2) y = "20"+y; date = y+"-"+String(d2[2]).padStart(2,"0")+"-"+String(d2[1]).padStart(2,"0"); }
    let cp = g(/\b(?:to|from)\s+([A-Za-z][A-Za-z .&'-]{1,40}?)(?=\s*(?:\d|,|\.|\(|\bon\b|\bat\b|current|transaction|fee|reference|$))/i);
    if (!cp){ const dsc = g(/(?:desc(?:ription)?|narration|ref)\s*[:.]\s*([^.\n]{3,50}?)(?=\s*(?:\b(?:bal|avl|available|date)\b|$|\.))/i); if (dsc) cp = dsc; }
    if (cp) cp = cp.replace(/\d/g,"").replace(/\s{2,}/g," ").trim();
    const provider = /telecel|vodafone/.test(low) ? "Telecel Cash" : /airteltigo|\bat money\b/.test(low) ? "AT Money" : /momo|mtn|mobile money/.test(low) ? "MTN MoMo" : null;
    return {kind, amount: num2(amt[1]), fee, elevy, currency:"GHS", counterparty: cp || null, provider, bank_name:null, date, txn_id: id, balance_after: bal, reference: reference ? reference.trim() : null, category:null};
  }).filter(Boolean);
}
function momoFor(provider){
  const momos = S.accounts.filter(a => a.type==="momo");
  const p = String(provider||"").toLowerCase();
  const key = /telecel|vodafone/.test(p) ? /telecel|vodafone/ : /\bat\b|airtel/.test(p) ? /\bat\b|airtel/ : /mtn|momo/.test(p) ? /mtn|momo/ : null;
  return (key && momos.find(a => key.test(a.name.toLowerCase()))) || momos[0] || null;
}
function smsToRows(msgs){
  const rows = [];
  const cashA = S.accounts.find(a => a.type==="cash");
  const firstBank = S.accounts.find(a => a.type==="bank");
  const cleanName = v => v ? String(v).replace(/[0-9+]{4,}/g,"").replace(/\s+/g," ").trim().slice(0,40) : "";
  msgs.forEach(m => {
    if (!m) return;
    const amount = Number(String(m.amount==null?"":m.amount).replace(/,/g,""));
    if (!(amount>0)) return;
    const isBankMsg = m.kind==="bank_debit" || m.kind==="bank_credit";
    const prov = String(m.provider||"");
    const isMomoProv = /momo|mtn|telecel|vodafone|at money|airtel/i.test(prov) || !prov;
    const acc = isBankMsg || (!isMomoProv && prov) ? (matchBank(prov, "GHS") || firstBank || momoFor(prov)) : (momoFor(prov) || firstBank);
    const hasDate = typeof m.date==="string" && /^\d{4}-\d{2}-\d{2}$/.test(m.date) && m.date<=today();
    const date = hasDate ? m.date : today();
    const who = cleanName(m.counterparty), refTxt = m.reference ? String(m.reference).slice(0,40) : "";
    const ref = m.txn_id ? (prov||"sms")+":"+String(m.txn_id).replace(/[^A-Za-z0-9.]/g,"").replace(/\.+$/,"").slice(0,40) : null;
    const pickCat = (kind, fb) => S.cats[kind].includes(m.category) ? m.category : (S.cats[kind].includes(fb) ? fb : (S.cats[kind].includes("Other") ? "Other" : S.cats[kind][0]));
    const r = {sel:true, amount, date, accountId: acc && acc.id, ref, warn:[], balAfter: Number(m.balance_after)>0 ? Number(m.balance_after) : null};
    switch (m.kind){
      case "payment_received": case "bank_credit": Object.assign(r, {type:"income", category:pickCat("income","Other"), note:(who?"From "+who:"Money received")+(refTxt?" – "+refTxt:"")}); break;
      case "cash_out": Object.assign(r, {type:"transfer", toAccountId: cashA && cashA.id, note:"Cash out"+(who?" at "+who:"")}); break;
      case "cash_in": Object.assign(r, {type:"transfer", toAccountId: acc && acc.id, accountId: cashA && cashA.id, note:"Cash in"+(who?" at "+who:"")}); break;
      case "to_bank": { const b = matchBank(m.bank_name, "GHS") || firstBank; Object.assign(r, {type:"transfer", toAccountId: b && b.id, note:"To "+(m.bank_name||"bank")}); if (m.bank_name && !matchBank(m.bank_name,"GHS")) r.warn.push("Choose the bank account it went to."); break; }
      case "from_bank": { const b = matchBank(m.bank_name, "GHS") || firstBank; Object.assign(r, {type:"transfer", toAccountId: acc && acc.id, accountId: b && b.id, note:"From "+(m.bank_name||"bank")}); break; }
      case "airtime_data": Object.assign(r, {type:"expense", category:pickCat("expense","Airtime & data"), note:who||"Airtime / data"}); break;
      case "other": Object.assign(r, {type:"expense", category:pickCat("expense","Other"), note:who||"SMS transaction", sel:false}); r.warn.push("Bese wasn’t sure what this was. Check the type before including it."); break;
      default: Object.assign(r, {type:"expense", category:pickCat("expense","Other"), note:(who||"Payment")+(refTxt?" – "+refTxt:"")});
    }
    if (!hasDate) r.warn.push("The message has no date, so it’s set to today. Change it if the payment was on another day.");
    if (ref && S.tx.some(t => t.ref===ref || (m.txn_id && t.ref && t.ref.split(":").pop()===ref.split(":").pop()))){ r.sel = false; r.warn.push("Already recorded."); }
    else {
      const near = S.tx.find(t => Math.abs((Number(t.amount)||0)-amount)<0.005 && (t.accountId===r.accountId || t.toAccountId===r.accountId) && (hasDate ? t.date===date : (daysUntil(t.date)<=0 && daysUntil(t.date)>=-7)));

  const accs = S.accounts.filter(a => a.type!=="cash");
  const defA = (accs.find(a=>a.type==="bank")||accs[0]||{}).id;
  openDlg(`<div class="dlg-head"><h2>Import a bank statement</h2><button class="iconbtn" data-close aria-label="Close">×</button></div>
  <div class="dlg-body"><p class="small muted" style="margin:0">Download your statement from internet banking, your banking app or MoMo, or ask your bank to email it. <strong>Excel or CSV</strong> gives the most accurate result; PDF works too.</p>
    <label class="field"><span>Which account is this statement for?</span><select class="input" id="stA">${S.accounts.map(a=>`<option value="${esc(a.id)}" ${a.id===defA?"selected":""}>${esc(a.name)}</option>`).join("")}</select></label>
    <label class="field"><span>Statement file</span><input class="input" id="stF" type="file" accept=".csv,.xlsx,.xls,.pdf,text/csv,application/pdf,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></label>
    <p class="hint">Bese reads the file on your device. For PDF statements, and to sort transactions into categories, the text is sent to Claude to read. Account numbers are left out of what Bese saves.</p>
    <div class="err" id="stErr"></div></div>
  <div class="dlg-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="stGo">Read statement</button></div>`);
  dlg.querySelector("#stGo").addEventListener("click", async () => {
    const err = dlg.querySelector("#stErr"), go = dlg.querySelector("#stGo"), f = dlg.querySelector("#stF").files[0], accId = dlg.querySelector("#stA").value;
    if (!f){ err.textContent = "Choose the statement file."; return; }
    if (f.size > 15*1024*1024){ err.textContent = "That file is too large. Try a shorter date range."; return; }
    const prog = t => { go.textContent = t; };
    go.disabled = true; err.textContent = "";
    let items = null;
    try {
      const name = f.name.toLowerCase();
      if (/\.pdf$/.test(name) || f.type==="application/pdf"){
        if (!sampleNS){ throw new Error("Reading PDF statements needs Claude, which isn’t available here. Download the statement as Excel or CSV instead."); }
        prog("Opening PDF…");
        const text = await pdfText(f, prog);
        if (text.replace(/\s/g,"").length < 50) throw new Error("This PDF has no readable text, probably a scanned image. Ask your bank for an Excel, CSV or digital PDF statement.");
        items = await aiFromText(text, prog);
      } else {
        prog("Reading file…");
        let rows;
        if (/\.csv$/.test(name) || f.type==="text/csv") rows = parseCSV(await fileText(f));
        else {
          await loadScript(LIBS.xlsx);
          const wb = window.XLSX.read(new Uint8Array(await fileBuf(f)), {type:"array", cellDates:true});
          const ws = wb.SheetNames.map(n => wb.Sheets[n]).map(sh => window.XLSX.utils.sheet_to_json(sh, {header:1, raw:true, defval:""})).sort((a,b)=>b.length-a.length)[0];
          rows = ws || [];
        }
        let mp = detectMap(rows);
        items = mp ? mapRows(rows, mp) : [];
        if (!items.length){ prog("Working out the columns…"); mp = await aiMap(rows); items = mp ? mapRows(rows, mp) : []; }
        if (!items.length) throw new Error("Bese couldn’t find the date and amount columns in this file. Check it’s the statement itself, not a summary page.");
      }
      if (!items.length) throw new Error("No transactions were found in this statement.");
      const ai = await aiClassify(items, prog);
      if (!dlg.open) return;
      closeDlg(); stmtReview(items, accId, ai || {});
    } catch(e){
      if (!dlg.open) return;
      go.disabled = false; go.textContent = "Read statement";
      err.textContent = e && e.message && !/^load$/.test(e.message) ? e.message : "The file couldn’t be read here. Try the Excel or CSV version of the statement.";
    }
  });
}
function stmtReview(items, accId, ai){
  const A = acct(accId); if (!A) return;
  const cashA = S.accounts.find(a => a.type==="cash"), momoA = S.accounts.find(a => a.type==="momo" && a.id!==accId);
  const otherBank = S.accounts.find(a => a.type==="bank" && a.id!==accId);
  const clean = t => String(t||"").replace(/\b\d{8,}\b/g,"").replace(/\s{2,}/g," ").trim().slice(0,80);
  const seen = {};
  const rows = items.map((it, idx) => {
    const c = ai[idx] && ai[idx].kind ? ai[idx] : classify(it);
    const kind = c.kind;
    const r = {sel:true, date:it.date, note: clean(it.desc) || (it.dir==="out"?"Payment":"Money received"), amount: it.amount, dir: it.dir, balance: it.balance, order: it.order, warn:""};
    if (kind==="cash_withdrawal" && it.dir==="out"){ r.type = "transfer"; r.other = cashA && cashA.id; }
    else if (kind==="to_momo" && it.dir==="out"){ r.type = "transfer"; r.other = (momoA||otherBank||{}).id; }
    else if (kind==="from_momo" && it.dir==="in"){ r.type = "transfer"; r.other = (momoA||otherBank||{}).id; }
    else if (kind==="charges" && it.dir==="out"){ r.type = "expense"; r.category = "Bank & MoMo charges"; }
    else if (it.dir==="in"){ r.type = "income"; r.category = S.cats.income.includes(c.category) ? c.category : (S.cats.income.includes("Other")?"Other":S.cats.income[0]); }
    else { r.type = "expense"; r.category = S.cats.expense.includes(c.category) ? c.category : (S.cats.expense.includes("Other")?"Other":S.cats.expense[0]); }
    const key = accId+"|"+it.date+"|"+it.amount+"|"+r.note;
    seen[key] = (seen[key]||0) + 1;
    r.id = "b-"+hashStr(key+"|"+seen[key]);
    if (S.tx.some(t => t.id===r.id)){ r.sel = false; r.warn = "Already imported."; }
    else { const dup = S.tx.find(t => Math.abs((Number(t.amount)||0)-it.amount)<0.005 && t.date===it.date && (t.accountId===accId || t.toAccountId===accId)); if (dup){ r.sel = false; r.warn = "Already in Bese"+(dup.note?" (“"+dup.note.slice(0,30)+"”)":"")+"."; } }
    return r;
  });
  const asc = rows.length>1 && rows[0].date <= rows[rows.length-1].date;
  const withBal = rows.filter(r => r.balance!=null && isFinite(r.balance));
  const finalBal = withBal.length ? (asc ? withBal[withBal.length-1] : withBal[0]).balance : null;
  const dates = rows.map(r=>r.date).sort();
  const effect = () => rows.reduce((b, r) => { if (!r.sel) return b; const a = Number(r.amount)||0; if (r.type==="income") return b + a; if (r.type==="expense") return b - a; return b + (r.dir==="in" ? a : -a); }, 0);
  const summary = () => {
    const sel = rows.filter(r=>r.sel), inn = sel.filter(r=>r.dir==="in").reduce((s,r)=>s+(Number(r.amount)||0),0), out = sel.filter(r=>r.dir==="out").reduce((s,r)=>s+(Number(r.amount)||0),0);
    const after = balance(A) + effect();
    let bal = "";
    if (finalBal!=null){ const match = Math.abs(after - finalBal) < 0.01; bal = `<div class="small" style="margin-top:6px">Statement closing balance: <strong>${money(finalBal, A.currency)}</strong>. ${esc(A.name)} in Bese after import: <strong>${money(after, A.currency)}</strong>. ${match ? "✓ They match." : "They don’t match. Some transactions may already be in Bese, or "+esc(A.name)+"’s starting balance may need updating in Accounts."}</div>`; }
    return `<div class="small muted">${dates[0]?esc(fmtDate(dates[0]))+" – "+esc(fmtDate(dates[dates.length-1])):""} · ${rows.length} lines · ${sel.length} selected · in ${money(inn, A.currency)} · out ${money(out, A.currency)}</div>${bal}`;
  };
  const otherOpts = sel => S.accounts.filter(a => a.id!==accId).map(a => `<option value="${esc(a.id)}" ${a.id===sel?"selected":""}>${esc(a.name)}</option>`).join("");
  const catOpts = (kind, sel) => (S.cats[kind].includes(sel) ? S.cats[kind] : S.cats[kind].concat([sel])).map(c => `<option ${c===sel?"selected":""}>${esc(c)}</option>`).join("");
  const rowHtml = (r, i) => `<div class="srow ${r.sel?"":"off"}" data-i="${i}">
    <input type="checkbox" data-f="sel" data-i="${i}" ${r.sel?"checked":""} aria-label="Include">
    <input class="input sdesc" data-f="note" data-i="${i}" value="${esc(r.note)}" aria-label="Note">
    <span class="samt ${r.dir==="in"?"pos":""}">${r.dir==="in"?"+":"−"}${money(r.amount, A.currency).replace("−","")}</span>
    <div class="sctl"><span class="small muted" style="align-self:center;min-width:72px">${esc(fmtDate(r.date))}</span>
      <select class="input" data-f="type" data-i="${i}">${r.dir==="out" ? `<option value="expense" ${r.type==="expense"?"selected":""}>Money out</option>` : `<option value="income" ${r.type==="income"?"selected":""}>Money in</option>`}<option value="transfer" ${r.type==="transfer"?"selected":""}>Transfer ${r.dir==="out"?"to":"from"}…</option></select>
      ${r.type==="transfer" ? `<select class="input" data-f="other" data-i="${i}">${otherOpts(r.other)}</select>` : `<select class="input" data-f="category" data-i="${i}">${catOpts(r.type==="income"?"income":"expense", r.category)}</select>`}
      ${r.warn ? `<span class="small" style="color:var(--gold);flex-basis:100%">${esc(r.warn)}</span>` : ""}</div></div>`;
  const draw = () => {
    dlg.querySelector("#stSum").innerHTML = summary();
    dlg.querySelector("#stRows").innerHTML = rows.map(rowHtml).join("");
    const n = rows.filter(r=>r.sel).length; const b = dlg.querySelector("#stSave"); b.textContent = n ? "Import "+n+" transaction"+(n===1?"":"s") : "Nothing selected"; b.disabled = !n;
  };
  openDlg(`<div class="dlg-head"><h2>Check the statement</h2><button class="iconbtn" data-close aria-label="Close">×</button></div>
  <div class="dlg-body"><p class="small" style="margin:0"><strong>${esc(A.name)}</strong>. Lines already in Bese are unticked. Change any type or category, untick what you don’t want, then import.</p>
    <div id="stSum" style="margin:8px 0"></div>
    <div class="row" style="gap:14px;margin-bottom:6px"><button class="linkbtn" id="stAll">Select all</button><button class="linkbtn" id="stNone">Select none</button></div>
    <div id="stRows"></div><div class="err" id="stErr2"></div></div>
  <div class="dlg-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="stSave">Import</button></div>`, draw);
  const body = dlg.querySelector(".dlg-body");
  body.addEventListener("change", e => {
    const f = e.target.dataset.f, i = Number(e.target.dataset.i); if (!f || isNaN(i)) return;
    const r = rows[i];
    if (f==="sel"){ r.sel = e.target.checked; e.target.closest(".srow").classList.toggle("off", !r.sel); dlg.querySelector("#stSum").innerHTML = summary(); const n = rows.filter(x=>x.sel).length; const b = dlg.querySelector("#stSave"); b.textContent = n ? "Import "+n+" transaction"+(n===1?"":"s") : "Nothing selected"; b.disabled = !n; return; }
    if (f==="note"){ r.note = e.target.value; return; }
    r[f] = e.target.value;
    if (f==="type"){ if (r.type==="transfer" && !r.other){ const o = S.accounts.find(a=>a.id!==accId); r.other = o && o.id; } if (r.type!=="transfer" && !r.category){ const kind = r.type==="income"?"income":"expense"; r.category = S.cats[kind].includes("Other")?"Other":S.cats[kind][0]; } }
    const y = body.scrollTop; draw(); body.scrollTop = y;
  });
  dlg.querySelector("#stAll").addEventListener("click", () => { rows.forEach(r => { if (!/Already imported/.test(r.warn)) r.sel = true; }); draw(); });
  dlg.querySelector("#stNone").addEventListener("click", () => { rows.forEach(r => r.sel = false); draw(); });
  dlg.querySelector("#stSave").addEventListener("click", () => {
    const err = dlg.querySelector("#stErr2");
    const chosen = rows.filter(r => r.sel);
    if (chosen.some(r => r.type==="transfer" && !acct(r.other))){ err.textContent = "Choose the other account for every transfer."; return; }
    let added = 0, catAdded = false;
    chosen.forEach((r, k) => {
      if (S.tx.some(t => t.id===r.id)) return;
      const tx = {id:r.id, ts:Date.now()+k, type:r.type, amount:r.amount, date:r.date, note:String(r.note||"").trim(), src:"statement"};
      if (r.type==="transfer"){ if (r.dir==="out"){ tx.accountId = accId; tx.toAccountId = r.other; } else { tx.accountId = r.other; tx.toAccountId = accId; } }
      else { tx.accountId = accId; tx.category = r.category; const kind = r.type==="income"?"income":"expense"; if (!S.cats[kind].includes(r.category)){ S.cats[kind].push(r.category); catAdded = true; } }
      S.tx.push(tx); dirty.months.add(tx.date.slice(0,7)); added++;
    });
    if (catAdded) dirty.core = true;
    markCore(); closeDlg(); render(); toast(added+" transaction"+(added===1?"":"s")+" imported");
  });
}

/* ---------- Check balance (reconciliation) ---------- */
function acctUsed(a){ return (Number(a.opening)||0)!==0 || S.tx.some(t => t.accountId===a.id || t.toAccountId===a.id); }
function needsCheck(a){ if (!acctUsed(a)) return false; const c = a.lastCheck; return !c || daysUntil(c.date) < -30; }
function checkStatus(a){
  const c = a.lastCheck;
  if (!c) return acctUsed(a) ? "Balance not checked yet" : "";
  const ago = -daysUntil(c.date), when = ago<=0 ? "today" : ago===1 ? "yesterday" : ago+" days ago";
  const off = Math.abs(Number(c.diff)||0) > 0.004;
  return (off ? "⚠ Checked "+when+": "+money(c.diff, a.currency)+" unexplained" : "✓ Checked "+when) + (ago>30 ? ". Time to check again." : "");
}
function checkBanner(inAccounts){
  const due = S.accounts.filter(needsCheck);
  if (!due.length) return "";
  return `<div class="banner">${due.length===1 ? esc(due[0].name)+" hasn’t" : due.length+" accounts haven’t"} had ${due.length===1?"its":"their"} balance checked against the bank, MoMo or your cash in the last month.${inAccounts ? "" : `<button class="btn small" data-action="go" data-to="accounts">Check balances</button>`}</div>`;
}
function pendingEffect(t, id){
  const a = Number(t.amount)||0;
  if (t.type==="income") return t.accountId===id ? a : 0;
  if (t.type==="expense") return t.accountId===id ? -a : 0;
  if (t.type==="transfer") return (t.accountId===id ? -a : 0) + (t.toAccountId===id ? (t.toAmount!=null && t.toAmount!=="" ? Number(t.toAmount) : a) : 0);
  if (t.type==="custody") return t.accountId===id ? (t.dir==="in" ? a : -a) : 0;
  return 0;
}
function checkDialog(a){
  const isCash = a.type==="cash";
  const calc = (date, actual) => {
    const book = balance(a, S.tx.filter(t => t.date<=date));
    const pend = S.tx.filter(t => chqPending(t) && t.date<=date && pendingEffect(t, a.id)!==0);
    const pendSum = pend.reduce((s,t)=>s+pendingEffect(t, a.id), 0);
    const expected = book - pendSum;
    const diff = actual==null ? null : Math.round((actual - expected)*100)/100;
    return {book, pend, pendSum, expected, diff};
  };
  const due = S.recur.filter(r => recurDue(r) && r.mode!=="auto" && (r.accountId===a.id || r.toAccountId===a.id));
  const draw = () => {
    const date = dlg.querySelector("#ckDate").value || today();
    const raw = dlg.querySelector("#ckAmt").value.trim(), actual = raw==="" ? null : num(raw);
    const c = calc(date, isNaN(actual) ? null : actual);
    let h = `<div class="rec-grid"><span>Bese’s balance on ${esc(fmtDate(date))}</span><span class="v">${money(c.book, a.currency)}</span>`;
    if (c.pend.length){
      c.pend.forEach(t => { h += `<span class="small muted">${pendingEffect(t,a.id)>0?"Less":"Add back"}: cheque not yet cleared – ${esc((t.note||"Cheque").slice(0,40))}</span><span class="v small">${money(-pendingEffect(t,a.id), a.currency)}</span>`; });
      h += `<span class="tot">What the ${isCash?"count":"bank"} should show</span><span class="v tot">${money(c.expected, a.currency)}</span>`;
    }
    if (c.diff!=null){
      const ok = Math.abs(c.diff) < 0.005;
      h += `<span class="${c.pend.length?"":"tot"}">${isCash?"Cash you counted":"What the "+(a.type==="momo"?"wallet":"bank")+" shows"}</span><span class="v ${c.pend.length?"":"tot"}">${money(actual, a.currency)}</span>`;
      h += `<span class="tot">${ok ? "Difference" : "Unexplained difference"}</span><span class="v tot ${ok?"pos":"neg"}">${ok ? "✓ None" : money(c.diff, a.currency)}</span></div>`;
      if (ok) h += `<p class="small pos" style="margin:0">Everything matches.</p>`;
      else {
        const tips = [];
        if (c.diff<0) tips.push((isCash ? "Cash spent that wasn’t recorded" : "Money out that isn’t in Bese yet, such as bank charges, COT, SMS alerts, E-Levy or a POS payment")+".");
        else tips.push((isCash ? "Cash received that wasn’t recorded" : "Money in that isn’t in Bese yet, such as interest, a transfer or a refund")+".");
        if (Math.abs(c.diff) < 50 && !isCash) tips.push("Small differences are usually fees or E-Levy. Pasting the latest SMS or importing the statement often finds them.");
        if (due.length) tips.push("Due but not recorded: "+due.map(r=>r.name+" ("+money(r.amount, recurCur(r))+")").join(", ")+".");
        tips.push("A transaction recorded against the wrong account or date.");
        h += `<div class="small" style="margin-top:4px"><strong>What could explain it</strong><ul style="margin:6px 0 0;padding-left:18px">${tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`;
      }
    } else h += `</div>`;
    dlg.querySelector("#ckOut").innerHTML = h;
    const ok = c.diff!=null && Math.abs(c.diff) < 0.005;
    dlg.querySelector("#ckOk").hidden = !ok;
    dlg.querySelector("#ckFix").hidden = c.diff==null || ok;
    return c;
  };
  openDlg(`<div class="dlg-head"><h2>${isCash ? "Count your cash" : "Check "+esc(a.name)+"’s balance"}</h2><button class="iconbtn" data-close aria-label="Close">×</button></div>
  <div class="dlg-body"><p class="small muted" style="margin:0">${isCash ? "Count the notes and coins you have, and enter the total." : "Open your "+(a.type==="momo"?"MoMo app or latest SMS":"banking app or statement")+" and enter the balance it shows."}</p>
    <div class="two"><label class="field"><span>${isCash?"Cash counted":"Balance shown"} (${sym(a.currency)})</span><input class="input amount-input" id="ckAmt" inputmode="decimal" placeholder="0.00" autofocus></label>
    <label class="field"><span>As at</span><input class="input" id="ckDate" type="date" value="${today()}"></label></div>
    <div id="ckOut"></div>
    <div id="ckFix" hidden style="margin-top:12px">
      <div class="choice">
        <button class="btn" id="ckAdd"><strong>Add the missing transaction</strong><br><span class="small muted">Record the charge, payment or receipt you missed.</span></button>
        <button class="btn" id="ckAdj"><strong>Record a balance adjustment</strong><br><span class="small muted">When you can’t find it. Logged in Activity with your reason.</span></button>
      </div>
      <label class="field" id="ckReasonBox" hidden><span>Reason for the adjustment</span><input class="input" id="ckReason" placeholder="e.g. Unidentified bank charges, October"></label>
      <div class="row wrap" style="margin-top:10px"><button class="btn small primary" id="ckAdjGo" hidden>Save adjustment and mark checked</button><button class="linkbtn" id="ckLeave">Save the check with the difference for now</button></div>
    </div>
    ${(a.checks||[]).length ? `<details style="margin-top:14px"><summary class="small muted" style="cursor:pointer">Past checks</summary><div class="small" style="margin-top:6px">${a.checks.slice().reverse().map(k=>`<div>${esc(fmtDate(k.date))}: ${money(k.actual, a.currency)} · ${Math.abs(Number(k.diff)||0)<0.005?"matched":"difference "+esc(money(k.diff, a.currency))}${k.adjusted?" (adjusted)":""}</div>`).join("")}</div></details>` : ""}
    <div class="err" id="ckErr"></div></div>
  <div class="dlg-foot"><button class="btn" data-close>Close</button><button class="btn primary" id="ckOk" hidden>Mark as checked</button></div>`, () => draw());
  ["input","change"].forEach(ev => { dlg.querySelector("#ckAmt").addEventListener(ev, draw); dlg.querySelector("#ckDate").addEventListener(ev, draw); });
  const save = (c, adjusted) => {
    const live = S.accounts.find(x => x.id===a.id); if (!live) return;
    const date = dlg.querySelector("#ckDate").value || today(), actual = num(dlg.querySelector("#ckAmt").value);
    const rec = {date, actual, sika: Math.round(c.book*100)/100, diff: adjusted ? 0 : c.diff, adjusted: !!adjusted, at: today()};
    live.lastCheck = rec; live.checks = (Array.isArray(live.checks) ? live.checks : []).concat([rec]).slice(-12);
    markCore(); closeDlg(); render();
    toast(Math.abs(rec.diff) < 0.005 ? live.name+" checked ✓" : live.name+": check saved with a "+money(rec.diff, live.currency)+" difference");
  };
  dlg.querySelector("#ckOk").addEventListener("click", () => { const c = draw(); if (c.diff!=null && Math.abs(c.diff)<0.005) save(c, false); });
  dlg.querySelector("#ckLeave").addEventListener("click", () => { const c = draw(); if (c.diff!=null) save(c, false); });
  dlg.querySelector("#ckAdd").addEventListener("click", () => {
    const c = draw(); if (c.diff==null) return; const date = dlg.querySelector("#ckDate").value || today();
    closeDlg();
    if (c.diff<0 && !isCash && !S.cats.expense.includes("Bank & MoMo charges")){ S.cats.expense.push("Bank & MoMo charges"); markCore(); }
    txDialog({type: c.diff<0 ? "expense" : "income", amount: Math.abs(c.diff), accountId: a.id, date, category: c.diff<0 && !isCash ? "Bank & MoMo charges" : undefined, note:""}, {title:"Add the missing transaction", banner:`<div class="scan-note">The difference is <strong>${money(Math.abs(c.diff), a.currency)}</strong>. Change the amount if it was only part of the difference, then check the balance again.</div>`});
  });
  dlg.querySelector("#ckAdj").addEventListener("click", () => { dlg.querySelector("#ckReasonBox").hidden = false; dlg.querySelector("#ckAdjGo").hidden = false; dlg.querySelector("#ckReason").focus(); });
  dlg.querySelector("#ckAdjGo").addEventListener("click", () => {
    const c = draw(), reason = dlg.querySelector("#ckReason").value.trim(), err = dlg.querySelector("#ckErr");
    if (c.diff==null || Math.abs(c.diff)<0.005) return;
    if (!reason){ err.textContent = "Give a reason for the adjustment."; return; }
    const date = dlg.querySelector("#ckDate").value || today(), kind = c.diff>0 ? "income" : "expense";
    if (!S.cats[kind].includes("Balance adjustment")) S.cats[kind].push("Balance adjustment");
    S.tx.push({id:uid(), ts:Date.now(), type:kind, amount:Math.abs(c.diff), date, accountId:a.id, category:"Balance adjustment", note:"Balance adjustment: "+reason.slice(0,80), src:"adjust"});
    dirty.months.add(date.slice(0,7));
    save(c, true);
  });
}

/* ---------- Shared analytics ---------- */
function txGHSamt(t){ const a = acct(t.accountId); return toGHS(t.amount, a ? a.currency : "GHS") || 0; }
function liquidGHS(){ let t = 0; S.accounts.forEach(a => { const v = toGHS(balance(a), a.currency); if (v!=null) t += v; }); return t; }
function heldGHS(){ return heldTotalGHS(); }
function wealth(){

let downloadsNS;
function canDl(){ return !!downloadsNS || STANDALONE; }
async function saveFile(o){
  if (downloadsNS) return downloadsNS.save(o);
  const ext = (o.filename.split(".").pop()||"").toLowerCase();
  const type = {csv:"text/csv", pdf:"application/pdf", xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", json:"application/json"}[ext] || "application/octet-stream";
  const blob = o.data instanceof Blob ? o.data : new Blob([o.data], {type});
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = o.filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function enableExport(){
  if (downloadsNS===undefined){ downloadsNS = null; try { if (window.claude && window.claude.use) downloadsNS = await window.claude.use("downloads"); } catch(e){ downloadsNS=null; } if (downloadsNS && current()==="reports") render(); }

function txDialog(t, opts){

      html = `<p class="hint" style="margin-top:10px">Money that isn’t yours, such as family contributions, funds you’re keeping for someone, or money to pass on. It shows in your account balance but isn’t counted as your income or your wealth.</p>

        <label class="field"><span>Purpose (optional)</span><input class="input" id="txPurpose" value="${esc(t._purpose||"")}" placeholder="e.g. Funeral contributions"></label></div>` : ""}
        <label class="field"><span>${t.dir==="in"?"Where is it being kept?":"Paid out from"}</span><select class="input" id="txAcct">${acctOptions(from?from.id:t.accountId)}</select></label>`;
    } else {
      html = `<div class="two"><label class="field"><span>${type==="income"?"Into":"Paid from"}</span><select class="input" id="txAcct">${acctOptions(from?from.id:t.accountId)}</select></label>
         <label class="field"><span>Category</span><select class="input" id="txCat">${catOptions(type, S.cats[type].includes(t.category)?t.category:S.cats[type][0])}</select></label></div>`;
    }
    dlg.querySelector("#txDyn").innerHTML = html;
    dlg.querySelectorAll("[data-type]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.type===type));
  };
  const keep = () => { t.accountId = val("#txAcct", t.accountId); t.toAccountId = val("#txTo", t.toAccountId); t.heldId = val("#txHeld", t.heldId); t._owner = val("#txOwner", t._owner); t._purpose = val("#txPurpose", t._purpose); };
  openDlg(`<div class="dlg-head"><h2>${opts.title || (isNew?"Add transaction":"Edit transaction")}</h2><button class="iconbtn" data-close aria-label="Close">×</button></div>

    ${opts.banner||""}

    <label class="field"><span>Amount</span><input class="input amount-input" id="txAmt" inputmode="decimal" placeholder="0.00" value="${esc(t.amount)}" autofocus></label>
    <div id="txDyn"></div>
    <div class="two"><label class="field"><span>Date</span><input class="input" id="txDate" type="date" value="${esc(t.date)}"></label>
    <label class="field"><span>Note (optional)</span><input class="input" id="txNote" value="${esc(t.note)}" placeholder="e.g. Makola groceries"></label></div>
    ${t.chq && t.chq.status!=="pending" ? `<p class="small muted" style="margin-top:10px">Cheque ${t.chq.status==="cleared"?"cleared"+(t.chq.clearedOn?" on "+esc(fmtDate(t.chq.clearedOn)):""):"bounced"+(t.chq.bouncedOn?" on "+esc(fmtDate(t.chq.bouncedOn)):"")}.</p>` : `<label class="row small" style="margin-top:12px;gap:8px"><input type="checkbox" id="txChq" ${chqPending(t)?"checked":""}> This is a cheque. Remind me to check it has cleared.</label>`}

  dlg.querySelectorAll("[data-type]").forEach(b => b.addEventListener("click", () => { keep(); type = b.dataset.type; autoAcct(); draw(); }));

    const chqBox = dlg.querySelector("#txChq");

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) { closeDlg(); return; }
  const el = e.target.closest("[data-action]"); if (!el) return;
  const id = el.dataset.id;
  switch (el.dataset.action){
    case "add-tx": txDialog(); break;
    case "sample-load": loadSample(); break;
    case "hide-banner": try { localStorage.setItem("bese:hideBanner","1"); } catch(e){} render(); break;
    case "sample-remove": if (armed(el, "Tap again to remove")) removeSample(); break;
    case "ai-ins": runAiInsights(); break;
    case "ai-ask": runAsk(); break;
    case "rp-pdf": downloadPDF(); break;
    case "rp-last": rpOpts = {period:"last-month", from:"", to:""}; render(); break;
    case "rp-xlsx": downloadXLSX(); break;
    case "check-acct": { const a = S.accounts.find(x=>x.id===id); if (a) checkDialog(a); break; }
    case "recur-add": recurDialog(); break;
    case "recur-edit": { const r = S.recur.find(x=>x.id===id); if (r) recurDialog(r); break; }
    case "recur-record": { const r = S.recur.find(x=>x.id===id); if (r){ if (dlg.open) closeDlg(); recordDueDialog(r); } break; }
    case "recur-skip": { recurSkip(id, false); if (dlg.open){ const it = el.closest(".item"); if (it) it.remove(); if (!dlg.querySelector(".item")) closeDlg(); } break; }
    case "recur-toggle": { const r = S.recur.find(x=>x.id===id); if (r){ r.active = !r.active; markCore(); render(); toast(r.active?"Resumed":"Paused"); } break; }
    case "chq-yes": chqAnswer(id, "yes"); break;
    case "chq-no": chqAnswer(id, "no"); break;
    case "chq-bounced": if (armed(el, "Tap again: bounced")) chqAnswer(id, "bounced"); break;
    case "scan": scanChoice(); break;
    case "sms": smsDialog(); break;
    case "stmt": stmtDialog(); break;
    case "cash-withdraw": case "cash-deposit": {
      const c = S.accounts.find(a=>a.type==="cash"), other = S.accounts.find(a=>a.type==="bank") || S.accounts.find(a=>c && a.id!==c.id);
      if (!c || !other){ toast("Add a bank or MoMo account first."); break; }
      const w = el.dataset.action==="cash-withdraw";
      txDialog({type:"transfer", accountId: w ? other.id : c.id, toAccountId: w ? c.id : other.id, note: w ? "Cash withdrawal" : "Cash deposit"});
      break;
    }
    case "cash-gift": { const c = S.accounts.find(a=>a.type==="cash"); txDialog({type:"income", accountId:c&&c.id, category: S.cats.income.includes("Gift") ? "Gift" : S.cats.income[0]}); break; }
    case "edit-tx": txDialog(Object.assign({}, S.tx.find(t=>t.id===id))); break;
    case "month": viewMonth = shiftMonth(viewMonth, Number(el.dataset.k)); render(); break;
    case "go": location.hash = el.dataset.to; break;
    case "filter": txFilter = el.dataset.f; render(); break;
    case "add-goal": goalDialog(); break;
    case "edit-goal": goalDialog(Object.assign({}, S.goals.find(g=>g.id===id))); break;
    case "fund-goal": fundDialog(S.goals.find(g=>g.id===id)); break;
    case "add-inv": invDialog(); break;
    case "edit-inv": invDialog(Object.assign({}, S.inv.find(i=>i.id===id))); break;
    case "add-acct": acctDialog(); break;
    case "edit-acct": acctDialog(Object.assign({}, S.accounts.find(a=>a.id===id))); break;
    case "add-prop": propDialog(); break;
    case "edit-prop": propDialog(Object.assign({}, S.props.find(p=>p.id===id))); break;
    case "add-biz": bizDialog(); break;
    case "edit-biz": bizDialog(Object.assign({}, S.biz.find(b=>b.id===id))); break;
    case "add-debt": debtDialog(); break;
    case "edit-debt": debtDialog(clone(S.debts.find(x=>x.id===id))); break;
    case "pay-debt": payDebtDialog(S.debts.find(x=>x.id===id)); break;
    case "held-new": txDialog({type:"custody", dir:"in", heldId:"new"}); break;
    case "held-in": case "held-out": {
      const h = S.held.find(x=>x.id===id); if (!h) break;
      const lastTx = S.tx.filter(t=>t.type==="custody"&&t.heldId===id).sort((a,b)=>b.date.localeCompare(a.date))[0];
      const a = (lastTx && acct(lastTx.accountId)) || S.accounts.find(x=>x.currency===h.currency) || S.accounts[0];
      txDialog({type:"custody", dir: el.dataset.action==="held-in" ? "in" : "out", heldId:id, accountId:a&&a.id, amount: el.dataset.action==="held-out" ? Math.round(Math.max(0,heldBal(h))*100)/100 : ""});
      break;
    }
    case "edit-held": { const h = S.held.find(x=>x.id===id); if (h) heldDialog(h); break; }
    case "save-fx": {
      const own = Object.assign({}, S.fx.own||{}), modes = Object.assign({}, S.fx.modes||{});
      for (const c of Object.keys(CURS)){ if (c==="GHS") continue;
        const mEl = document.getElementById("fxMode-"+c), oEl = document.getElementById("fxOwn-"+c); if (!mEl || !oEl) continue;
        const raw = oEl.value.trim(), v = raw==="" ? 0 : num(raw);
        if (raw!=="" && !(v>0)){ toast("The rate for "+curName(c)+" must be a number greater than zero."); return; }
        if (mEl.value==="manual" && !(v>0) && fxMode(c)==="manual" && !refRate(c)) { if (raw==="") { delete own[c]; modes[c] = "manual"; continue; } }
        if (mEl.value==="manual" && !(v>0) && raw==="" && refRate(c)){ toast("Enter your own rate for "+curName(c)+", or choose Automatic."); return; }
        if (v>0) own[c] = v; else delete own[c];
        modes[c] = mEl.value;
      }
      const fx = Object.assign({}, S.fx, {own, modes}); fx.USD = own.USD || null; fx.mode = modes.USD;
      S.fx = fx; markCore(); render(); toast("Rates saved"); break; }
    case "add-cat": { const k = el.dataset.kind, inp = document.getElementById("newCat-"+k), v = inp.value.trim(); if (!v) return; if (S.cats[k].includes(v)){ toast("That category already exists."); return; } S.cats[k].push(v); markCore(); render(); toast("Category added"); break; }
    case "del-cat": { const k = el.dataset.kind, c = el.dataset.cat; if (S.cats[k].length<2){ toast("Keep at least one category."); return; } S.cats[k] = S.cats[k].filter(x=>x!==c); delete S.budgets[c]; markCore(); render(); toast("Category removed. Past entries keep their label."); break; }
    case "export": exportCSV(); break;
    case "reset": resetAll(el); break;
    case "lock-setup": lockDialog("new"); break;
    case "lock-change": verifyDialog("Change PIN or password", () => lockDialog("change")); break;
    case "lock-off": verifyDialog("Turn off app lock", () => { S.lock = null; try { localStorage.removeItem("sika:bio"); } catch(e){} markCore(); render(); toast("App lock turned off"); }); break;
    case "lock-now": lockNow(); break;
    case "bio-setup": setupBio(); break;
    case "bio-off": try { localStorage.removeItem("sika:bio"); } catch(e){} render(); toast("Fingerprint turned off on this device"); break;
    case "restore": restore(id); break;
    case "act-filter": actFilter = el.dataset.f; actLimit = 200; render(); break;
    case "act-more": actLimit += 200; render(); break;
  }
});
document.addEventListener("input", e => {
  if (e.target.id==="txSearch"){ txSearch = e.target.value; clearTimeout(document._st); document._st = setTimeout(render, 200); }
});
document.addEventListener("change", e => {
  if (e.target.id==="lockAuto" && S.lock){ S.lock.auto = Number(e.target.value)||5; markCore(); toast("Auto-lock updated"); return; }
  if (e.target.id==="nwCur" || e.target.id==="rpCur"){ S.prefs = Object.assign({}, S.prefs, {cur: e.target.value}); saveLocal(); if (db){ dirty.core = true; schedule(); } render(); return; }
  if (e.target.id==="fcH" || e.target.id==="fcAvg" || e.target.id==="fcMat" || e.target.id==="fcHeld"){ fcOpts = {h:Number(document.getElementById("fcH").value)||6, avg:document.getElementById("fcAvg").checked, mat:document.getElementById("fcMat").checked, held:document.getElementById("fcHeld").checked}; render(); return; }
  if (e.target.id==="rpPeriod" || e.target.id==="rpFrom" || e.target.id==="rpTo"){ rpOpts = {period:document.getElementById("rpPeriod").value, from:(document.getElementById("rpFrom")||{}).value||"", to:(document.getElementById("rpTo")||{}).value||""}; render(); return; }
  if (e.target.id==="actKind"){ actKind = e.target.value; actLimit = 200; render(); return; }
  const c = e.target.dataset && e.target.dataset.budget;
  if (c!=null){ const v = num(e.target.value); if (e.target.value.trim()==="" || !(v>0)) delete S.budgets[c]; else S.budgets[c] = v; markCore(); render(); }
});

async function exportCSV(){
  if (!canDl()) return;
  const rows = [["Date","Type","Amount","Currency","Account","To account","Category","Note"]];
  S.tx.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(t => { const a=acct(t.accountId), to=acct(t.toAccountId); rows.push([t.date,t.type,t.amount,a?a.currency:"GHS",a?a.name:"",to?to.name:"",t.category||"",t.note||""]); });
  const csv = rows.map(r=>r.map(v=>{ v=String(v==null?"":v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }).join(",")).join("\n");
  try { await saveFile({filename:"bese-transactions-"+today()+".csv", data:csv}); } catch(e){ /* viewer declined */ }
}
function resetAll(btn){
  if (!armed(btn, "Tap again to delete everything")) return;
  const months = new Set(S.tx.map(t=>t.date.slice(0,7)));
  const keepLock = S.lock; S = DEFAULT(); S.lock = keepLock; audit(); saveLocal();
  if (db){ months.forEach(m => writeDoc("tx-"+m, {items:[]})); writeDoc("core", coreBody()); flush(); }
  render(); toast("All data deleted. Each item can be restored from Activity.");
}

render();
})();
</script>
